<body><main><header><a href="../index.html#/knowledge">← 返回综合知识</a><h1>知识强化专题 · 八大模块</h1><p>原有 24 章内容保持不变。本页新增 ITTO 速查、项目文件实例、案例找错、计算公式、跨过程流转、八大绩效域、配置变更与易错知识对比，可按章节筛选。</p><div class="meta"><span>覆盖 1—24 章</span><span>8 个专题</span><span id="all-count"></span></div></header>

<script>const DATA={"sections":[["ITTO 输入·工具·输出","6—17章","it","📥"],["项目文件与管理计划","6—17章","docs","📁"],["案例分析找错","8—19章","cases","🔎"],["计算知识与公式","10、11、21章","math","∑"],["管理过程关联与流转","6—17章","flows","🔄"],["八大项目绩效域","18章","domains","🎯"],["变更与配置管理","6、19章","changes","🧩"],["高频知识对比","1—24章","compare","⚖️"]],"items":[{"group":"it","chapters":[6],"title":"制定项目章程","body":"输入：商业论证、协议、组织过程资产、事业环境因素。\n工具与技术：专家判断、数据收集、人际关系与团队技能、会议。\n输出：项目章程、假设日志。","tip":"正式授权项目；项目章程不是项目管理计划的组成部分"},{"group":"it","chapters":[6],"title":"制定项目管理计划","body":"输入：其他知识领域规划过程输出、项目章程、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、人际关系与团队技能、会议。\n输出：项目管理计划。","tip":"整合各子计划及三大基准，批准后变更须遵循控制流程"},{"group":"it","chapters":[6],"title":"指导与管理项目工作","body":"输入：项目管理计划、项目文件、批准的变更请求、事业环境因素、组织过程资产。\n工具与技术：专家判断、项目管理信息系统、会议。\n输出：可交付成果、工作绩效数据、问题日志、变更请求、项目管理计划更新、项目文件更新。","tip":"工作绩效数据来自执行，工作绩效信息来自监控分析"},{"group":"it","chapters":[6],"title":"监控项目工作","body":"输入：项目管理计划、项目文件、工作绩效信息、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据分析、决策、会议。\n输出：工作绩效报告、变更请求、项目管理计划更新、项目文件更新。","tip":"工作绩效报告用于沟通与综合决策"},{"group":"it","chapters":[6],"title":"实施整体变更控制","body":"输入：项目管理计划、项目文件、工作绩效报告、变更请求、事业环境因素、组织过程资产。\n工具与技术：专家判断、变更控制工具、数据分析、决策、会议。\n输出：批准的变更请求、项目管理计划更新、项目文件更新。","tip":"CCB 审批不等于执行；批准后再实施、验证和关闭"},{"group":"it","chapters":[7],"title":"规划范围管理","body":"输入：项目章程、项目管理计划、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据分析、会议。\n输出：范围管理计划、需求管理计划。","tip":"管理计划说明如何管理，不等于范围基准"},{"group":"it","chapters":[8],"title":"收集需求","body":"输入：项目章程、项目管理计划、项目文件、商业文件、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、数据分析、决策、数据表现、人际关系与团队技能、系统交互图、原型法。\n输出：需求文件、需求跟踪矩阵。","tip":"需求跟踪矩阵连接需求来源、交付成果与测试验收"},{"group":"it","chapters":[8],"title":"定义范围","body":"输入：项目章程、项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据分析、决策、人际关系与团队技能、产品分析。\n输出：项目范围说明书、项目文件更新。","tip":"范围说明书强调包含与不包含的内容、验收标准"},{"group":"it","chapters":[8],"title":"创建 WBS","body":"输入：项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、分解。\n输出：范围基准、项目文件更新。","tip":"范围基准=范围说明书+WBS+WBS 词典"},{"group":"it","chapters":[8],"title":"确认范围","body":"输入：项目管理计划、项目文件、核实的可交付成果、工作绩效数据。\n工具与技术：检查、决策。\n输出：验收的可交付成果、工作绩效信息、变更请求、项目文件更新。","tip":"质量控制先核实；确认范围侧重客户/发起人正式验收"},{"group":"it","chapters":[8],"title":"控制范围","body":"输入：项目管理计划、项目文件、工作绩效数据、组织过程资产。\n工具与技术：数据分析。\n输出：工作绩效信息、变更请求、项目管理计划更新、项目文件更新。","tip":"未经批准的范围蔓延是典型找错点"},{"group":"it","chapters":[10],"title":"定义活动","body":"输入：项目管理计划、事业环境因素、组织过程资产。\n工具与技术：专家判断、分解、滚动式规划、会议。\n输出：活动清单、活动属性、里程碑清单、变更请求、项目管理计划更新。","tip":"WBS 分解工作包；定义活动再分解出具体进度活动"},{"group":"it","chapters":[10],"title":"排列活动顺序","body":"输入：项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：紧前关系绘图法、确定和整合依赖关系、提前量与滞后量、项目管理信息系统。\n输出：项目进度网络图、项目文件更新。","tip":"FS/SS/FF/SF 四种依赖，与强制/选择/外部/内部属性不可混淆"},{"group":"it","chapters":[10],"title":"估算活动持续时间","body":"输入：项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、类比估算、参数估算、三点估算、自下而上估算、数据分析、决策、会议。\n输出：持续时间估算、估算依据、项目文件更新。","tip":"三点估算区分三角分布与 Beta 分布"},{"group":"it","chapters":[10],"title":"制定进度计划","body":"输入：项目管理计划、项目文件、协议、事业环境因素、组织过程资产。\n工具与技术：进度网络分析、关键路径法、资源优化、数据分析、提前量和滞后量、进度压缩、项目管理信息系统、敏捷发布规划。\n输出：进度基准、项目进度计划、进度数据、项目日历、变更请求、计划及文件更新。","tip":"进度基准需要批准；计划可展示甘特图和里程碑"},{"group":"it","chapters":[11],"title":"估算成本","body":"输入：项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、类比、参数、自下而上、三点估算、数据分析、项目管理信息系统、决策。\n输出：成本估算、估算依据、项目文件更新。","tip":"成本估算不是成本基准；先估算再汇总预算"},{"group":"it","chapters":[11],"title":"制定预算","body":"输入：项目管理计划、项目文件、商业文件、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、成本汇总、数据分析、历史信息审核、资金限制平衡、融资。\n输出：成本基准、项目资金需求、项目文件更新。","tip":"成本基准通常包含应急储备，不包含管理储备"},{"group":"it","chapters":[11],"title":"控制成本","body":"输入：项目管理计划、项目文件、项目资金需求、工作绩效数据、组织过程资产。\n工具与技术：专家判断、数据分析、完工尚需绩效指数、项目管理信息系统。\n输出：工作绩效信息、成本预测、变更请求、计划及文件更新。","tip":"CV、SV 与 CPI、SPI 不是同一量纲"},{"group":"it","chapters":[12],"title":"控制质量","body":"输入：项目管理计划、项目文件、批准的变更请求、可交付成果、工作绩效数据、事业环境因素、组织过程资产。\n工具与技术：数据收集、数据分析、检查、测试/产品评估、数据表现、会议。\n输出：质量控制测量结果、核实的可交付成果、工作绩效信息、变更请求、更新。","tip":"控制质量关注结果符合要求；管理质量关注过程及改进"},{"group":"it","chapters":[13],"title":"规划资源管理","body":"输入：项目章程、项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据表现、组织理论、会议。\n输出：资源管理计划、团队章程、项目文件更新。","tip":"资源管理计划区分实物资源和团队资源"},{"group":"it","chapters":[14],"title":"规划沟通管理","body":"输入：项目章程、项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、沟通需求分析、沟通技术、沟通模型、沟通方法、人际关系与团队技能、数据表现、会议。\n输出：沟通管理计划、项目管理计划更新、项目文件更新。","tip":"区分互动式、推式、拉式沟通"},{"group":"it","chapters":[15],"title":"识别风险","body":"输入：项目管理计划、项目文件、采购文档、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、数据分析、人际关系与团队技能、提示清单、会议。\n输出：风险登记册、风险报告、项目文件更新。","tip":"风险登记册记录单项风险，风险报告汇总整体风险情况"},{"group":"it","chapters":[15],"title":"规划风险应对","body":"输入：项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、人际关系与团队技能、威胁应对策略、机会应对策略、应急应对策略、整体风险应对策略、数据分析、决策。\n输出：变更请求、计划及文件更新。","tip":"威胁：上报/规避/转移/减轻/接受；机会：上报/开拓/分享/提高/接受"},{"group":"it","chapters":[16],"title":"规划采购管理","body":"输入：项目章程、商业文件、项目管理计划、项目文件、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、数据分析、供方选择分析、会议。\n输出：采购管理计划、采购策略、招标文件、采购工作说明书、供方选择标准、自制或外购决策、独立成本估算、变更请求及更新。","tip":"采购工作说明书规定供货范围，供方选择标准用于评标"},{"group":"it","chapters":[16],"title":"实施采购","body":"输入：项目管理计划、项目文件、采购文档、卖方建议书、事业环境因素、组织过程资产。\n工具与技术：专家判断、广告、投标人会议、数据分析、人际关系与团队技能。\n输出：选定卖方、协议、变更请求、计划及文件更新。","tip":"招标文件、投标建议书、选定卖方、协议在顺序上不同"},{"group":"it","chapters":[16],"title":"控制采购","body":"输入：项目管理计划、项目文件、协议、采购文档、批准的变更请求、工作绩效数据、事业环境因素、组织过程资产。\n工具与技术：专家判断、索赔管理、数据分析、检查、审计。\n输出：采购关闭、工作绩效信息、采购文档更新、变更请求及更新。","tip":"采购关闭和项目关闭不是同一层级"},{"group":"it","chapters":[17],"title":"识别干系人","body":"输入：项目章程、商业文件、项目管理计划、项目文件、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、数据分析、数据表现、会议。\n输出：干系人登记册、变更请求、计划及文件更新。","tip":"干系人动态变化；不是启动阶段识别一次即可"},{"group":"it","chapters":[17],"title":"规划干系人参与","body":"输入：项目章程、项目管理计划、项目文件、协议、事业环境因素、组织过程资产。\n工具与技术：专家判断、数据收集、数据分析、决策、数据表现、会议。\n输出：干系人参与计划。","tip":"区分权力/利益方格与参与度评估矩阵"},{"group":"docs","chapters":[6],"title":"项目章程","body":"主要内容：正式授权项目，记录目的、可测量目标、主要需求、高层级风险、里程碑、预算与项目经理权限。\n形成时机：项目启动阶段由发起人发布。\n维护规则：重大变更遵循治理授权与控制要求。","tip":"示例：批准某政务系统建设、预算120万元、年底上线、指定项目经理"},{"group":"docs","chapters":[6],"title":"商业论证与效益管理计划","body":"主要内容：商业论证说明商业需要、可选方案、成本收益；效益管理计划说明目标收益、测量方式、时间和责任。\n形成时机：项目发起和立项决策期间。\n维护规则：定期复核可实现性与效益实现状态。","tip":"示例：三年降低运维费用30%，年度核验故障处理时长"},{"group":"docs","chapters":[6],"title":"项目管理计划","body":"主要内容：整合范围、需求、进度、成本、质量、资源、沟通、风险、采购、干系人等管理计划与三大基准。\n形成时机：规划过程整合形成并获得批准。\n维护规则：影响基准的修改经正式变更控制。","tip":"示例：周报、成本控制阈值、关键里程碑和应急程序"},{"group":"docs","chapters":[6],"title":"假设日志 / 问题日志","body":"主要内容：假设日志记录未证实的条件和制约；问题日志记录已发生的问题、负责人、截止期限和处理状态。\n形成时机：启动/执行期间建立。\n维护规则：随验证、问题解决持续更新。","tip":"示例：假设第三方接口按期可用；问题为接口联调已超期"},{"group":"docs","chapters":[8],"title":"需求文件与需求跟踪矩阵","body":"主要内容：前者描述功能和非功能需求，后者逐项关联需求来源、设计、测试和验收。\n形成时机：收集需求。\n维护规则：需求澄清、变更和测试时持续更新。","tip":"示例：REQ-001→设计模块M1→测试TC-016→验收项A-2"},{"group":"docs","chapters":[8],"title":"范围说明书 / WBS / WBS词典","body":"主要内容：范围说明书定义边界；WBS 展示分解结构；WBS词典细述工作包信息。\n形成时机：定义范围、创建WBS。\n维护规则：经批准的范围变更后更新。","tip":"示例：1.3身份认证模块，词典含验收标准和责任团队"},{"group":"docs","chapters":[10],"title":"活动清单 / 网络图 / 进度基准","body":"主要内容：清单列活动；网络图描述依赖；进度基准为批准的进度版本。\n形成时机：定义活动、排序、制定进度计划。\n维护规则：进度调整受控更新。","tip":"示例：A需求确认→B设计→C开发→D验收"},{"group":"docs","chapters":[11],"title":"成本估算 / 成本基准 / 资金需求","body":"主要内容：估算是预测资源成本；成本基准是批准的分期预算；资金需求涉及拨付节奏与储备。\n形成时机：估算成本、制定预算。\n维护规则：成本绩效监控与变更时修订。","tip":"示例：分季度支出计划和储备使用审批记录"},{"group":"docs","chapters":[12],"title":"质量测量指标 / 测试报告 / 质量报告","body":"主要内容：分别回答测什么、实测结果是什么、质量管理整体情况如何。\n形成时机：规划质量、控制质量、管理质量。\n维护规则：按测试轮次、缺陷关闭情况更新。","tip":"示例：严重缺陷数=0，响应时间P95≤2秒"},{"group":"docs","chapters":[13],"title":"资源分解结构 / 团队章程 / 资源日历","body":"主要内容：资源分解结构展示类别；团队章程约定团队规则；资源日历体现资源可用时间。\n形成时机：规划资源、组建团队。\n维护规则：人员或资源供给变化时更新。","tip":"示例：测试组每周三可使用性能测试服务器"},{"group":"docs","chapters":[14],"title":"沟通管理计划 / 项目沟通记录","body":"主要内容：明确对象、内容、频率、渠道、责任人及反馈机制。\n形成时机：规划沟通管理。\n维护规则：干系人变化或沟通低效时修订。","tip":"示例：每周五给发起人发送风险摘要和里程碑偏差"},{"group":"docs","chapters":[15],"title":"风险登记册 / 风险报告","body":"主要内容：登记册跟踪单项风险、概率、影响、负责人及措施；报告聚焦整体风险暴露与趋势。\n形成时机：识别风险开始形成。\n维护规则：评估、应对、监控风险时反复更新。","tip":"示例：R-17供应商延误，概率高、影响中、责任人张工"},{"group":"docs","chapters":[16],"title":"采购管理计划 / 采购工作说明书 / 供方选择标准 / 协议","body":"主要内容：分别规定采购方式和管理规则、要购买什么、怎么评选供方、合同义务。\n形成时机：规划采购、实施采购。\n维护规则：采购实施、控制及合同变更时更新。","tip":"示例：SOW含设备验收标准，评分标准含技术和服务项"},{"group":"docs","chapters":[17],"title":"干系人登记册 / 参与计划","body":"主要内容：登记册列身份、影响、利益、态度；参与计划约定如何提升其参与和支持。\n形成时机：识别、规划干系人参与。\n维护规则：干系人立场和权力变化时更新。","tip":"示例：业务负责人支持度不足时安排原型评审"},{"group":"docs","chapters":[19],"title":"配置管理计划 / 配置项清单 / 配置状态记录","body":"主要内容：分别规定标识、控制、审计方法及版本和基线信息。\n形成时机：规划配置管理、建立配置库。\n维护规则：版本发布、变更、审计后更新。","tip":"示例：接口规范v2.1，处于已批准基线"},{"group":"cases","chapters":[8],"title":"范围蔓延","body":"错误做法：客户口头提出新功能，项目组未经评估直接开发。\n错因：绕过范围变更与基准控制。\n正确做法：记录需求→影响分析→提交变更→审批→更新基准后实施。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[8],"title":"确认范围时机错误","body":"错误做法：项目组内部测试通过就宣称客户验收完成。\n错因：将控制质量等同确认范围。\n正确做法：先核实可交付成果，再由有权干系人正式验收。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[9],"title":"需求变更缺少追踪","body":"错误做法：需求调整后仅修改代码，不更新需求追踪矩阵。\n错因：需求、设计、测试、验收脱节。\n正确做法：同步维护需求文件、追踪矩阵和相关测试。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[10],"title":"只压缩关键路径但忽略风险","body":"错误做法：一味赶工并行，未评估返工和资源约束。\n错因：进度压缩会增加成本/质量风险。\n正确做法：先分析关键路径与可压缩活动，再比较赶工/快速跟进。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[11],"title":"用实际成本判断进度","body":"错误做法：只因 AC 高于预算就认定进度延期。\n错因：混淆成本与进度绩效。\n正确做法：分别用 CPI/CV 和 SPI/SV 判断。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[12],"title":"跳过质量计划直接测试","body":"错误做法：没有验收标准、指标和抽样规则就执行测试。\n错因：无法判定结果是否满足要求。\n正确做法：先定义指标和标准，保留质量测量结果及缺陷闭环。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[13],"title":"人员冲突由项目经理直接强制裁决","body":"错误做法：没有分析冲突根源也未尝试协作解决。\n错因：不当选择冲突解决方法。\n正确做法：优先协作解决和解决问题；具体方法结合紧迫性情境。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[14],"title":"重大风险只发邮件不确认","body":"错误做法：发出通知便认为相关干系人已收到并理解。\n错因：沟通未闭环。\n正确做法：为高影响事项设置确认反馈、升级和跟踪。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[15],"title":"风险发生后仍称其为风险","body":"错误做法：供应商已延期但未转入问题管理。\n错因：风险尚未发生与已发生问题混淆。\n正确做法：建立问题日志、落实纠正措施并评估次生风险。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[16],"title":"先签合同后走审批","body":"错误做法：供方已经开工才补做供应商评审及授权。\n错因：程序和合同控制失效。\n正确做法：先遵循采购策略与审批，再形成协议并履约。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[17],"title":"只识别干系人不管理参与","body":"错误做法：启动阶段列完名单后不再更新。\n错因：忽略参与态度及人员变化。\n正确做法：周期性评估权力/利益和参与度并调整策略。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[18],"title":"机械照搬同一管理流程","body":"错误做法：不同生命周期项目采用完全相同的管理实践。\n错因：忽略裁剪与绩效域交互。\n正确做法：依据不确定性、复杂性、交付节奏裁剪。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"cases","chapters":[19],"title":"未经 CCB 批准就修改基线","body":"错误做法：开发人员直接覆盖已冻结的生产基线。\n错因：破坏配置完整性和变更追溯。\n正确做法：提交申请、影响分析、审批、实施、版本标识、验证和关闭。","tip":"案例答题句式：存在……问题，应当……，并形成……记录。"},{"group":"math","chapters":[10],"title":"PERT 三点估算","body":"公式/方法：三角分布期望=(乐观+最可能+悲观)/3；Beta-PERT期望=(乐观+4×最可能+悲观)/6；Beta标准差=(悲观−乐观)/6。\n例题：O=4、M=7、P=16，Beta期望=(4+28+16)/6=8天，标准差=2天。","tip":"先看题目指定三角还是 Beta；标准差不等于方差"},{"group":"math","chapters":[10],"title":"关键路径、浮动时间","body":"公式/方法：总浮动=最迟开始−最早开始=最迟完成−最早完成；自由浮动=紧后活动最早开始的最小值−本活动最早完成。\n例题：若 ES=3、EF=7、LS=5、LF=9，总浮动=2天。","tip":"有多条关键路径时并行路径都要检查"},{"group":"math","chapters":[10],"title":"进度压缩","body":"公式/方法：赶工：增加资源以缩短工期；快速跟进：原本顺序的工作并行。\n例题：关键活动原需10天，增加资源后8天，需同时评估增加的成本。","tip":"压缩非关键活动未必缩短总工期"},{"group":"math","chapters":[11],"title":"挣值分析 CV、SV、CPI、SPI","body":"公式/方法：CV=EV−AC；SV=EV−PV；CPI=EV/AC；SPI=EV/PV。\n例题：PV=100、EV=80、AC=90：CV=−10、SV=−20、CPI≈0.89、SPI=0.80。","tip":"差值与比值单位不同；CPI、SPI低于1通常不利"},{"group":"math","chapters":[11],"title":"完工估算 EAC","body":"公式/方法：典型持续偏差：EAC=BAC/CPI；非典型偏差：EAC=AC+(BAC−EV)。\n例题：BAC=200、EV=80、AC=100：若偏差持续，CPI=0.8，EAC=250。","tip":"题目未指定未来绩效假设时，不能机械套用单一EAC公式"},{"group":"math","chapters":[11],"title":"完工尚需绩效指数 TCPI","body":"公式/方法：基于 BAC：TCPI=(BAC−EV)/(BAC−AC)；基于EAC：TCPI=(BAC−EV)/(EAC−AC)。\n例题：BAC=200、EV=100、AC=120，BAC基础TCPI=100/80=1.25。","tip":"分母要区分BAC或EAC；成本超支时达到原BAC可能很困难"},{"group":"math","chapters":[14],"title":"沟通渠道","body":"公式/方法：n名干系人两两建立潜在沟通渠道：n(n−1)/2。\n例题：5人共10条，新增1人变成15条，增加5条。","tip":"渠道数不是实际邮件或会议次数"},{"group":"math","chapters":[21],"title":"NPV 净现值","body":"公式/方法：NPV=Σ(CFt/(1+r)^t)−初始投资；同风险条件下NPV>0通常可接受。\n例题：初始投资100、两年各回收60、贴现率10%：NPV≈4.13。","tip":"时间点t=0现金流不需折现；单位和时点必须一致"},{"group":"math","chapters":[21],"title":"静态/动态回收期","body":"公式/方法：静态回收期使用未折现累计现金流；动态回收期使用折现后累计现金流。\n例题：投资100，每年回收40：静态回收期2.5年；动态需给定折现率另算。","tip":"回收期非投资收益率，动态回收通常不短于静态回收"},{"group":"math","chapters":[21],"title":"收益率 ROI","body":"公式/方法：ROI=(收益−投资)/投资×100%，具体项目要以题目定义的成本与净收益口径为准。\n例题：投资100、总收益130：ROI=30%。","tip":"不要与净现值或动态投资收益率混算"},{"group":"math","chapters":[21],"title":"指派与运输问题","body":"公式/方法：指派问题：每个任务分配一个主体；运输问题：满足供需并最小化总运输成本。\n例题：示例：3个仓库、4个目的地，先检查供需平衡再建运输表。","tip":"匈牙利法适合指派；运输问题可用伏格尔法产生初始解"},{"group":"flows","chapters":[6,8,10,11],"title":"目标到三大基准","body":"项目章程 → 项目管理计划 → 需求文件 → 范围说明书/WBS/WBS词典（范围基准）→ 活动清单/网络图（进度基准）→ 成本估算/预算（成本基准）","tip":"基准需要批准；各领域计划互相制约"},{"group":"flows","chapters":[8,12],"title":"质量核实到范围验收","body":"项目工作形成可交付成果 → 控制质量得到核实的可交付成果 → 确认范围得到验收的可交付成果 → 结束项目/阶段移交","tip":"内部核实 ≠ 正式验收"},{"group":"flows","chapters":[6,10,11],"title":"工作绩效数据到报告","body":"指导与管理项目工作→工作绩效数据；控制进度/控制成本等过程→工作绩效信息；监控项目工作→工作绩效报告","tip":"数据、信息、报告不可互换"},{"group":"flows","chapters":[6,19],"title":"变更请求全生命周期","body":"识别问题或偏差 → 变更请求 → 影响评估 → CCB/有权机构审批 → 指导与管理项目工作执行 → 控制质量核实 → 更新基准/配置记录 → 通知并关闭","tip":"紧急变更遵循预设快速审批流程，不等于跳过记录"},{"group":"flows","chapters":[8,10,11,15],"title":"范围变更的联动","body":"新增需求→评估范围/进度/成本/资源/风险→审批→更新WBS、活动、预算、风险登记册→复核验收与沟通","tip":"影响分析必须跨知识领域"},{"group":"flows","chapters":[13,14,17],"title":"干系人与沟通及资源","body":"识别干系人→分析支持和影响→制定参与计划/沟通管理计划→团队执行沟通→监督沟通与参与→调整策略","tip":"干系人参与不只靠邮件通知"},{"group":"flows","chapters":[15,16],"title":"采购风险联动","body":"自制外购决策→采购策略→选择供方→协议→控制采购→识别履约风险→风险应对/索赔/变更","tip":"合同变更可能触发风险和基准变更"},{"group":"flows","chapters":[6,18],"title":"过程与绩效域的两种视角","body":"十大知识领域侧重管理过程与成果；八大绩效域侧重相关活动共同产生的预期成果及衡量","tip":"不是一一映射，也不能把八大绩效域视为第八个过程组"},{"group":"domains","chapters":[18],"title":"干系人绩效域","body":"预期目标：形成有效工作关系、推动支持与认同。\n检查指标示例：支持程度、参与质量、冲突与抵制变化。\n关联知识领域：17章干系人管理、14章沟通。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"团队绩效域","body":"预期目标：形成共享责任、协作文化与高绩效团队。\n检查指标示例：团队稳定性、技能覆盖、冲突解决情况。\n关联知识领域：13章资源管理、14章沟通。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"开发方法和生命周期绩效域","body":"预期目标：使交付方式、节奏与项目特征相适配。\n检查指标示例：交付节奏、反馈周期、裁剪依据。\n关联知识领域：6章生命周期、10章进度。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"规划绩效域","body":"预期目标：建立适合情境的、可演进的协调计划。\n检查指标示例：基准偏差、重新规划触发条件。\n关联知识领域：8—11章三大基准。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"项目工作绩效域","body":"预期目标：保证资源、采购、流程和变更的有效执行。\n检查指标示例：工作效率、问题处理、采购履约。\n关联知识领域：6章整合、13章资源、16章采购。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"交付绩效域","body":"预期目标：交付符合验收和价值目标的成果。\n检查指标示例：需求覆盖率、验收率、缺陷率、实现的收益。\n关联知识领域：8章范围、12章质量。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"测量绩效域","body":"预期目标：用适宜指标理解当前状态并支持决策。\n检查指标示例：CPI、SPI、缺陷趋势、客户满意度。\n关联知识领域：10—12章进度成本质量。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"domains","chapters":[18],"title":"不确定性绩效域","body":"预期目标：识别威胁和机会并提高韧性。\n检查指标示例：风险敞口、应对有效性、储备使用情况。\n关联知识领域：15章风险管理。","tip":"绩效域的指标是教学示例，应根据项目情境裁剪，不代表统一法定阈值。"},{"group":"changes","chapters":[6],"title":"整体变更控制与CCB职责","body":"提交变更请求→记录并分类→评估范围/进度/成本/质量/风险→由获授权人员或CCB审议→批准/拒绝/推迟→实施→验证→关闭\n场景：CCB负责授权范围内的变更决策，项目经理组织分析、实施和跟踪。","tip":"不要把提出变更、批准变更和实施变更合并成一步"},{"group":"changes","chapters":[19],"title":"配置项标识与基线","body":"建立配置标识规则（名称/编号/版本/状态/责任人）→配置项纳入配置库→创建基线→变更控制\n场景：示例：SRS-v1.0，已基线；接口说明v1.1，待评审。","tip":"基线是经批准的配置项集合或配置状态，不能随意覆盖"},{"group":"changes","chapters":[19],"title":"配置状态记录与审计","body":"记录配置项版本、变更单、审批、实现、发布和回退情况；功能配置审计核对要求满足情况，物理配置审计核对实际配置与文档一致性\n场景：示例：CR-032关联接口代码v2.3、测试报告T-87和上线单。","tip":"状态报告关注变更历史；配置审计关注一致性"},{"group":"changes","chapters":[19],"title":"问题、风险、缺陷、变更区别","body":"风险：尚未确定发生；问题：已发生且需要处置；缺陷：产品不符合要求；变更：对受控文件/基准/成果提出修改请求\n场景：示例：接口可能延期=风险；已经延期=问题；接口功能错误=缺陷；要求增加接口=变更。","tip":"一个缺陷可能引发问题日志和变更请求，概念并非互斥"},{"group":"changes","chapters":[19],"title":"紧急变更与回退","body":"事先设定紧急权限、影响范围和追认机制；实施前保存备份、确定回退和验证方案；事后补全审计证据\n场景：示例：严重漏洞紧急修复必须留下授权、变更记录和回退测试。","tip":"紧急不等于任何人可直接修改生产配置"},{"group":"compare","chapters":[1,2],"title":"数字化、数字化转型与信息化","body":"信息化侧重信息技术支持业务；数字化强调数字化数据与技术应用；数字化转型强调业务模式、流程与组织能力的系统性变革","tip":"识别题目问的是技术应用、业务改造还是组织战略"},{"group":"compare","chapters":[3,4],"title":"IT治理、IT管理、IT审计","body":"治理回答方向与监督；管理回答规划组织与执行；审计通过证据评价控制和合规","tip":"治理≠日常运维；审计≠直接替代管理"},{"group":"compare","chapters":[5],"title":"单元测试、集成测试、系统测试、验收测试","body":"从模块到接口到全系统到用户业务验收","tip":"验收主体与测试目标容易出题"},{"group":"compare","chapters":[6],"title":"项目章程、项目管理计划、项目文件","body":"章程负责正式授权；管理计划负责如何执行、监控与收尾；项目文件记录具体事实、估算、风险和问题","tip":"区分文件用途而非只看名称"},{"group":"compare","chapters":[7,16],"title":"招标、投标、评标、定标与签约","body":"招标方发出采购要求；投标方提交建议书；评审按标准比较；定标形成中标结果；随后依规签署合同","tip":"注意招投标活动的先后和授权主体"},{"group":"compare","chapters":[8],"title":"产品范围与项目范围","body":"产品范围强调产品的功能与特性；项目范围强调为交付产品必须完成的工作","tip":"产品范围变化可能影响项目范围，但概念不同"},{"group":"compare","chapters":[8],"title":"核实的成果与验收的成果","body":"控制质量产生核实的可交付成果；确认范围产生验收的可交付成果","tip":"内部质量检查≠客户正式验收"},{"group":"compare","chapters":[9,13],"title":"RACI与资源分解结构 RBS","body":"RACI强调任务角色责任；RBS按层级展示资源类别与结构","tip":"不要把责任分配矩阵当组织架构图"},{"group":"compare","chapters":[10],"title":"关键路径与关键链","body":"关键路径重点考虑逻辑关系与工期；关键链还考虑资源制约和缓冲","tip":"关键路径活动的总浮动通常为0，但受约束时须按模型判断"},{"group":"compare","chapters":[11],"title":"应急储备与管理储备","body":"应急储备用于已识别风险的应对并纳入成本基准；管理储备用于未知未知风险，不纳入成本基准","tip":"项目总预算与成本基准可能不同"},{"group":"compare","chapters":[12],"title":"质量管理与质量控制","body":"管理质量聚焦过程与改进；控制质量聚焦检查、测试和结果满足标准","tip":"不是“质量管理负责领导、质量控制负责测试”这么简单"},{"group":"compare","chapters":[13],"title":"冲突解决方法","body":"撤退/回避、缓和/包容、妥协/调解、强迫/命令、合作/解决问题按情境选择","tip":"合作解决通常更利于根因处理，但不是所有紧急情况都适用"},{"group":"compare","chapters":[14],"title":"互动式、推式、拉式沟通","body":"互动式支持实时反馈；推式发送给指定接收方；拉式由接收方主动查询","tip":"发送≠对方已理解"},{"group":"compare","chapters":[15],"title":"规避、转移、减轻与接受","body":"规避消除威胁；转移使第三方承担部分后果；减轻降低概率/影响；接受保留并监控风险","tip":"风险转移不等于风险不存在"},{"group":"compare","chapters":[16],"title":"总价、成本补偿、工料合同","body":"总价强调约定价格；成本补偿按允许成本报销并加费用；工料按工时/材料计价","tip":"分析风险分担、范围清晰度与采购管理成本"},{"group":"compare","chapters":[17],"title":"权力利益方格与参与度评估矩阵","body":"方格评价权力与关注度；矩阵对比当前与目标参与状态","tip":"一个用于分类管理，一个用于参与差距分析"},{"group":"compare","chapters":[18],"title":"十大知识领域与八大绩效域","body":"前者按知识领域组织管理过程，后者从绩效结果视角看相互关联的活动","tip":"并非简单一一对应关系"},{"group":"compare","chapters":[19],"title":"配置控制与变更控制","body":"配置控制确保受控配置项的版本及完整性；整体变更控制协调项目各方面变更决策","tip":"配置项变更需依据授权流程，变更审批也需落地到配置库"},{"group":"compare","chapters":[20],"title":"项目、项目集、项目组合","body":"项目交付独特成果；项目集协调管理相关项目获取协同收益；项目组合以战略目标选择和优化投资","tip":"相关项目集合不必然等同项目组合"},{"group":"compare","chapters":[21],"title":"静态与动态投资回收期","body":"静态不折现；动态考虑资金时间价值","tip":"题目给了贴现率时先辨别要求哪一种"},{"group":"compare","chapters":[22,23],"title":"组织治理与组织管理","body":"治理确定方向、监督和问责；管理在治理框架内组织资源与执行","tip":"董事会治理与执行管理职责不同"},{"group":"compare","chapters":[24],"title":"法律规则与教材记忆点","body":"法规适用需核对现行版本、实施时间与过渡条款；教材知识点侧重考试要求","tip":"遇到法律时间节点必须标注法规依据和版本，不凭记忆改法规"}]};
const q=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let kind='all';q('chapter').innerHTML+=[...Array(24)].map((_,i)=>'<option value="'+(i+1)+'">第'+(i+1)+'章</option>').join('');
const tabs=[['全部','all'],...DATA.sections.map(s=>[s[0],s[2]])];
q('tabs').innerHTML=tabs.map(t=>'<button data-k="'+t[1]+'">'+esc(t[0])+'</button>').join('');
q('all-count').textContent=DATA.items.length+' 条补充条目';
function render(){const ch=+q('chapter').value,t=q('search').value.trim().toLowerCase();q('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.k===kind));const found=DATA.items.filter(x=>(kind==='all'||x.group===kind)&&(!ch||x.chapters.includes(ch))&&(!t||(x.title+' '+x.body+' '+x.tip).toLowerCase().includes(t)));q('count').textContent='当前显示 '+found.length+' 条 / 共 '+DATA.items.length+' 条';q('results').innerHTML=found.length?found.map(x=>'<article class="item"><div><span class="pill">'+esc(DATA.sections.find(s=>s[2]===x.group)[0])+'</span>'+x.chapters.map(c=>'<span class="pill">第'+c+'章</span>').join('')+'</div><h2>'+esc(x.title)+'</h2><p>'+esc(x.body)+'</p>'+(x.tip?'<div class="tip">易错提示 / 示例：'+esc(x.tip)+'</div>':'')+'</article>').join(''):'<p class="empty">没有匹配条目，请调整筛选条件。</p>';}
q('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;render()});q('chapter').addEventListener('change',render);q('search').addEventListener('input',render);q('clear').addEventListener('click',()=>{q('chapter').value='0';q('search').value='';kind='all';render()});const p=new URLSearchParams(location.search);if(p.has('chapter'))q('chapter').value=p.get('chapter');if(p.has('topic'))kind=p.get('topic');render();</script></body></html>
