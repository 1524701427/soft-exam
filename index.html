<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#101b38" />
<meta name="description" content="信息系统项目管理师24章学习平台：章节知识点、思维导图、练习题、错题本、模拟考试、案例与论文。" />
<title>高项研习社 · 信息系统项目管理师学习平台</title>
<link rel="stylesheet" href="./assets/style.css?v=1.6" />
<link rel="stylesheet" href="./assets/visuals.css?v=1.6" />
</head>
<body>
<div id="app" v-cloak :class="{'dark-mode':state.settings.dark}">
  <aside class="sidebar" :class="{'mobile-open':sidebarOpen}">
    <div class="brand"><div class="brand-mark">研<span>·</span></div><div><strong>高项研习社</strong><small>信息系统项目管理师</small></div><button class="mobile-close" @click="sidebarOpen=false">✕</button></div>
    <div class="sidebar-scroll">
      <div class="nav-label">学习工作台</div>
      <button v-for="item in navMain" :key="item.id" class="nav-item" :class="{'active':activeView===item.id}" @click="navigate(item.id)"><span class="nav-icon" v-html="icon(item.icon)"></span><span>{{item.label}}</span><span v-if="item.id==='wrong' && state.wrongIds.length" class="nav-pill">{{state.wrongIds.length}}</span></button>
      <div class="nav-label nav-gap">学习资源</div>
      <button v-for="item in navResources" :key="item.id" class="nav-item" :class="{'active':activeView===item.id}" @click="navigate(item.id)"><span class="nav-icon" v-html="icon(item.icon)"></span><span>{{item.label}}</span></button>
      <div class="sidebar-divider"></div>
      <div class="side-section-title"><span>教材章节</span><button @click="navigate('chapters')" title="查看24章">全部 <span class="arrow-small">›</span></button></div>
      <div v-for="g in EXAM_CATALOG" :key="g.group" class="chapter-side-group"><div class="chapter-group-label">{{g.group}}</div><button v-for="n in g.chapters" :key="n" class="chapter-mini" :class="{'selected':selectedChapter===getChapterId(n)}" @click="openChapter(getChapterId(n))"><span class="chapter-mini-no">{{String(getChapterId(n)).padStart(2,'0')}}</span><span class="ellipsis">{{n}}</span><span v-if="isChapterReady(getChapterId(n))" class="side-dot"></span></button></div>
    </div>
    <div class="sidebar-bottom"><div class="user-avatar">学</div><div class="user-info"><strong>我的学习空间</strong><small>仅保存在当前浏览器</small></div><button class="side-gear" title="设置和数据管理" @click="navigate('settings')" v-html="icon('settings')"></button></div>
  </aside>
  <div v-if="sidebarOpen" class="mobile-scrim" @click="sidebarOpen=false"></div>
  <div class="app-shell">
    <header class="topbar"><button class="mobile-toggle" @click="sidebarOpen=true" v-html="icon('menu')"></button><div class="breadcrumbs"><span>备考中心</span><span class="bread-sep">/</span><strong>{{viewTitle}}</strong></div><div class="top-right"><div class="global-search"><span v-html="icon('search')"></span><input v-model="searchQuery" @keydown.enter="performSearch" placeholder="搜索章节、知识点、题目..." /><kbd @click="performSearch">↵</kbd></div><button class="top-icon-btn" title="切换深色模式" @click="state.settings.dark=!state.settings.dark" v-html="icon(state.settings.dark?'sun':'moon')"></button><span class="top-avatar">学</span></div></header>
    <main class="main-content">
      <!-- 首页 -->
      <template v-if="activeView==='home'">
        <div class="page-heading"><div><div class="eyebrow"><span class="tiny-dot"></span> 2026 软考高级 · 备考空间</div><h1>每一个知识点，都算数。<span class="wave">✦</span></h1><p>把繁杂的教材变成清晰的学习路径，从理解考点到熟练答题。</p></div><div class="date-pill"><span v-html="icon('calendar')"></span>{{todayLabel}}</div></div>
        <div class="hero-banner"><div class="hero-content"><div class="hero-kicker">YOUR STUDY JOURNEY · 99 INTERACTIVE DIAGRAMS</div><h2>继续学习，向拿证更近一步</h2><p>24 章教材框架 · 前八章 99 张互动图解与 275 道习题</p><div class="hero-actions"><button class="primary-light-btn" @click="openKnowledge(recommendedTopic)">接着学 <span>→</span></button><button class="ghost-light-btn" @click="navigate('practice')">去刷题 <span>↗</span></button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="floating-card card-1">✓ <span>知识点掌握</span></div><div class="floating-card card-2">✦ <span>每日进步</span></div><div class="book-graphic"><span>高项</span><small>STUDY</small></div><div class="floating-star s1">✦</div><div class="floating-star s2">✧</div></div></div>
        <section class="chapter-art-rail" aria-label="新章节图解概览">
          <button class="chapter-art-card" @click="openVisualInMaps('c8-seven-processes')"><img src="./assets/chapter08-overview.svg" alt="第八章整合管理：七大过程、章程、项目计划、绩效报告与整体变更控制" loading="lazy"><span><strong>第 08 章 · 整合管理</strong><small>15 个知识小节 · 52 道练习 · 24 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c7-five-feasibility')"><img src="./assets/chapter07-overview.svg" alt="第七章立项管理：建议、可行性研究、项目评估及决策" loading="lazy"><span><strong>第 07 章 · 立项管理</strong><small>6 个知识小节 · 30 道习题 · 13 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c5-model')"><img src="./assets/chapter05-overview.svg" alt="第五章信息系统工程，软件、数据、集成与安全四条学习主线" loading="lazy"><span><strong>第 05 章 · 信息系统工程</strong><small>20 个知识小节 · 45 道习题 · 16 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c6-principles')"><img src="./assets/chapter06-overview.svg" alt="第六章项目管理概论，项目要素、项目经理、原则与价值交付主线" loading="lazy"><span><strong>第 06 章 · 项目管理概论</strong><small>17 个知识小节 · 25 道习题 · 15 张新增图解　点击看图 →</small></span></button>
        </section>
        <div class="stat-grid"><div class="stat-card" v-for="stat in dashboardStats" :key="stat.label"><div class="stat-head"><span class="stat-ico" :class="stat.tone" v-html="icon(stat.icon)"></span><span class="stat-desc">{{stat.caption}}</span></div><div class="stat-value">{{stat.value}}<span v-if="stat.unit">{{stat.unit}}</span></div><div class="stat-name">{{stat.label}}</div></div></div>
        <section class="panel study-analytics-panel"><div class="panel-heading"><div><h3>八章学习热力图 <span class="chart-mini-icon">✦ VISUAL</span></h3><p>每章展示真实的掌握率与练习正确率，点选章节即可继续学习</p></div><button class="text-link" @click="navigate('progress')">查看学习分析 →</button></div><div class="study-analytics-body"><div class="study-ring" :style="{'--pct':masteryPercent+'%'}"><div><strong>{{masteryPercent}}%</strong><span>总体掌握率</span></div></div><div class="chapter-analytics-bars"><button class="chapter-analytics-row" v-for="s in visualChapterStats" :key="s.id" @click="openChapter(s.id)"><span class="analytics-row-label"><b>CH {{String(s.id).padStart(2,'0')}}</b>{{s.name}}</span><span class="analytics-row-metrics"><span class="analytics-track"><i :style="{width:s.mastery+'%'}"></i></span><strong>{{s.mastery}}%</strong><small>正确率 {{s.answered?s.accuracy+'%':'—'}} · {{s.answered}}题</small></span></button></div></div></section><div class="home-columns"><section class="panel current-progress-panel"><div class="panel-heading"><div><h3>正在学习的章节</h3><p>从整体概览到逐节理解，有重点地推进</p></div><button class="text-link" @click="navigate('chapters')">查看全部章节 <span>→</span></button></div><div class="new-chapter-banner"><span>最新上线 · 第 08 章 项目整合管理</span><button @click="openChapter(8)">学习第八章 →</button></div><div class="new-chapter-banner secondary-chapter-banner"><span>第 07 章 · 立项管理</span><button @click="openChapter(7)">学习第七章 →</button></div><div class="new-chapter-banner secondary-chapter-banner"><span>第 06 章 · 项目管理概论</span><button @click="openChapter(6)">复习第六章 →</button></div><div class="current-chapter"><div class="chapter-symbol">01</div><div class="current-chapter-info"><div class="chapter-type">第一部分 · 信息技术与信息系统</div><h4>第 01 章 · 信息化发展</h4><div class="progress-meta"><span>已录入知识点整体掌握</span><strong>{{masteredCount}} / {{allTopics.length}}</strong></div><div class="progress-track"><div :style="{width:masteryPercent+'%'}"></div></div></div><button class="round-next" @click="openKnowledge(recommendedTopic)" title="继续学习" v-html="icon('arrow-right')"></button></div><div class="section-summary-list"><button v-for="s in EXAM_SECTIONS" :key="s.id" @click="openKnowledge(s.children.find(c=>!state.mastered.includes(c.id))?.id || s.children[0].id)" class="section-summary-row"><span class="sec-num">{{s.id}}</span><span class="sec-name">{{s.title}}</span><span class="section-count">{{s.children.filter(c=>state.mastered.includes(c.id)).length}}/{{s.children.length}}</span><span class="mini-arrow">›</span></button></div></section>
        <section class="panel quick-panel"><div class="panel-heading"><div><h3>快捷学习</h3><p>选择一种适合当下的学习方式</p></div></div><div class="quick-grid"><button v-for="a in quickActions" :key="a.view" class="quick-card" @click="navigate(a.view)"><span class="quick-icon" :class="a.tone" v-html="icon(a.icon)"></span><strong>{{a.name}}</strong><small>{{a.desc}}</small><span class="quick-enter">↗</span></button></div><div class="study-tip"><div class="tip-icon">✦</div><div><strong>今日学习提示</strong><p>本次新增第 7 章立项管理和第 8 章项目整合管理，重点关注可行性研究、项目章程、七个整合过程及整体变更控制。先看图解、再记 ITTO、最后刷题。</p></div></div></section></div>
        <div class="home-columns bottom-columns"><section class="panel"><div class="panel-heading"><div><h3>24 章学习路线</h3><p>教材四大模块 · 统一组织学习、练习与复习</p></div><button class="text-link" @click="navigate('chapters')">章节总览 →</button></div><div class="roadmap-groups"><div v-for="(g,i) in EXAM_CATALOG" class="roadmap-row" :key="g.group"><span class="roadmap-index" :class="g.color">{{String(i+1).padStart(2,'0')}}</span><div><strong>{{g.group}}</strong><small>{{g.chapters.length}} 个章节</small></div><div class="roadmap-track"><span :style="{width: groupMasteryPercent(g)+'%'}"></span></div></div></div></section><section class="panel source-panel"><div class="panel-heading"><div><h3>本章资料</h3><p>已录入知识点、考点与章节练习</p></div></div><div class="source-note">本学习站内置原创交互式知识图解和自主整理的文字要点；不包含原始授课 PDF 及原版导图图片。习题答案沿用讲义参考答案，年份标记未经官方真题逐条核验。</div></section></div>
      </template>
      <!-- 章节管理 -->
      <template v-else-if="activeView==='chapters'"><div class="page-heading compact"><div><div class="eyebrow">THE LEARNING ROADMAP</div><h1>教材章节<span class="title-light"> · 24 章</span></h1><p>按第 4 版教材结构组织，章节内容可独立追加，学习记录不会被覆盖。</p></div><button class="outline-btn" @click="navigate('settings')"><span v-html="icon('upload')"></span> 导入章节数据</button></div><div class="overview-strip"><div><strong>24</strong><span>章节总数</span></div><div><strong>{{availableChapterCount}}</strong><span>已录入内容</span></div><div><strong>{{masteredCount}}</strong><span>已掌握知识小节</span></div><div><strong>{{allQuestions.length}}</strong><span>已录入练习题</span></div></div><div v-for="group in EXAM_CATALOG" :key="group.group" class="catalog-section"><div class="catalog-group-heading"><span class="category-bar" :class="group.color"></span><h2>{{group.group}}</h2><small>{{group.chapters.length}} 章</small></div><div class="chapter-card-grid"><button v-for="name in group.chapters" :key="name" class="chapter-card" :class="{'is-ready':isChapterReady(getChapterId(name))}" @click="openChapter(getChapterId(name))"><div class="chapter-card-top"><span class="chapter-card-number">CH {{String(getChapterId(name)).padStart(2,'0')}}</span><span class="ready-label" :class="{'muted':!isChapterReady(getChapterId(name))}">{{isChapterReady(getChapterId(name))?'已录入':'待导入'}}</span></div><h3>{{name}}</h3><div class="chapter-card-bottom"><span>{{getChapterId(name)===1 ? '15 节知识点 · 40 道题' : getChapterId(name)===2 ? '11 节知识点 · 46 道题' : getChapterId(name)===3 ? '8 节知识点 · 17 道题' : getChapterId(name)===4 ? '8 节知识点 · 20 道题' : isChapterReady(getChapterId(name)) ? '已导入学习资料' : '目录已建立，内容待添加'}}</span><span class="chapter-open-arrow" v-html="icon('arrow-up-right')"></span></div></button></div></div></template>
      <!-- 知识点 -->
      <template v-else-if="activeView==='knowledge'"><div class="page-heading compact"><div><div class="eyebrow">CHAPTER {{String(selectedChapter).padStart(2,'0')}} / KNOWLEDGE</div><h1>{{chapterTitle}}</h1><p>先搭建知识框架，再通过重点记忆与原题练习巩固。</p></div><button class="outline-btn" @click="navigate('maps')"><span v-html="icon('map')"></span> 查看交互图解</button></div>
      <div v-if="!currentChapterSections.length" class="empty-panel"><span class="empty-illustration">▤</span><h2>第 {{selectedChapter}} 章内容尚未录入</h2><p>章节目录已配置。可在「数据与设置」中导入该章的知识点与题目；不会自动生成未经核对的教材知识。</p><button class="primary-btn" @click="navigate('settings')">去导入资料</button></div>
      <template v-else><div class="chapter-visual-overview"><div class="visual-overview-summary"><span class="visual-overview-label">CHAPTER OVERVIEW</span><strong>{{currentChapterSections.length}} 个大节 · {{currentChapterTopicList.length}} 小节 · {{currentChapterVisuals.length}} 张图解</strong><div class="visual-overview-track"><span :style="{width:chapterMasteryPercent+'%'}"></span></div></div><div class="visual-overview-links"><button v-for="visual in currentChapterVisuals.slice(0,5)" :key="visual.id" @click="openVisualInMaps(visual.id)"><span>◈</span>{{visual.title}}<b>↗</b></button><button class="visual-more" @click="navigate('maps')">全部图解 →</button></div></div><div class="learning-layout"><aside class="learning-outline panel"><div class="outline-heading"><strong>本章目录</strong><small>{{currentChapterTopicList.length}} 个知识小节</small></div><div class="chapter-vertical-progress"><div :style="{width:chapterMasteryPercent+'%'}"></div></div><div v-for="sec in currentChapterSections" :key="sec.id" class="outline-group"><button class="outline-parent" @click="toggleSectionCollapse(sec.id)"><span>{{sec.id}} {{sec.title}}</span><span :class="{'rotated':!openSectionGroups.includes(sec.id)}" v-html="icon('chevron-down')"></span></button><div v-if="openSectionGroups.includes(sec.id)"><button v-for="t in sec.children" :key="t.id" class="outline-child" :class="{'outline-active':selectedTopic===t.id}" @click="selectedTopic=t.id;readingTab='course'"><span class="status-circle" :class="{'is-done':state.mastered.includes(t.id)}">{{state.mastered.includes(t.id)?'✓':''}}</span><span class="ellipsis">{{t.id}} {{t.title}}</span></button></div></div><button class="outline-question-btn" @click="navigate('practice')"><span v-html="icon('clipboard')"></span> 本章刷题训练 <span>→</span></button></aside>
      <article class="lesson-area"><div class="lesson-topline"><div><span class="lesson-id">{{selectedTopic}}</span><span class="lesson-label">知识精讲</span></div><div class="lesson-actions"><button class="icon-text-btn" @click="toggleStar('topic:'+selectedTopic)"><span v-html="icon(state.starred.includes('topic:'+selectedTopic)?'star-fill':'star')"></span>{{state.starred.includes('topic:'+selectedTopic)?'已收藏':'收藏'}}</button><button class="icon-text-btn" @click="openPdf(currentTopicPage)"><span v-html="icon('external')"></span> 原讲义 P{{currentTopicPage}}</button></div></div><h2 class="lesson-title">{{currentTopicTitle}}</h2><p class="lesson-lead">{{currentNote?.lead || '该节内容已建立，待补充学习资料。'}}</p><div class="lesson-tabs"><button :class="{'on':readingTab==='course'}" @click="readingTab='course'">考点精讲</button><button :class="{'on':readingTab==='highlights'}" @click="readingTab='highlights'">标题类必背 <span>{{currentSectionHighlights.length}}</span></button><button :class="{'on':readingTab==='notes'}" @click="readingTab='notes'">我的笔记</button></div>
      <template v-if="readingTab==='course'"><section v-if="topicVisuals.length" class="topic-visuals"><div class="visual-section-eyebrow"><span>先看图，再记考点</span><strong>图形化理解</strong></div><exam-visual v-for="visual in topicVisuals" :key="visual.id" :diagram="visual" dense @navigate="openKnowledge"></exam-visual></section><div v-else-if="sectionVisuals.length" class="related-visual-rail"><span>◈ 本节相关图解</span><button v-for="visual in sectionVisuals.slice(0,2)" :key="visual.id" @click="openVisualInMaps(visual.id)">{{visual.title}} ↗</button></div><div class="note-block" v-for="(b,idx) in currentNote?.blocks||[]" :key="idx"><div class="note-block-heading"><span class="block-index">{{String(idx+1).padStart(2,'0')}}</span><h3>{{b.title}}</h3></div><div v-if="b.type==='concept'" class="definition-grid"><div class="definition-row" v-for="(item,k) in b.items" :key="k"><strong>{{item[0]}}</strong><p>{{item[1]}}</p></div></div><div v-else-if="b.type==='chips'" class="chip-cloud"><span v-for="chip in b.items" :key="chip">{{chip}}</span></div><div v-else-if="b.type==='steps'" class="step-stack"><div v-for="(step,j) in b.items" :key="j" class="study-step"><span class="step-number">{{j+1}}</span><div><strong>{{step[0]}}</strong><p>{{step[1]}}</p></div></div></div><div v-else class="analogy-box"><span class="analogy-icon">✦</span><p>{{b.text}}</p></div></div><div v-if="currentNote?.tip" class="memory-tip"><span>✧</span><div><strong>考前速记</strong><p>{{currentNote.tip}}</p></div></div><div v-if="!currentNote?.blocks?.length" class="empty-inline">知识点内容待导入，可以先查看目录或导入该章资料。</div></template>
      <template v-else-if="readingTab==='highlights'"><div class="highlight-intro">本章标题类必背考点共 {{currentChapterHighlights.length}} 条，按小节对应的主题归类展示。</div><div class="highlight-card" v-for="point in currentSectionHighlights" :key="point.id"><button class="star-mini" @click="toggleStar(point.id)" :title="state.starred.includes(point.id)?'取消收藏':'收藏'" v-html="icon(state.starred.includes(point.id)?'star-fill':'star')"></button><div><span class="highlight-number">考点 {{String(point.number).padStart(2,'0')}} · P{{point.sourcePage}}</span><p>{{point.text}}</p></div></div><div v-if="!currentSectionHighlights.length" class="empty-inline">暂无该节标题清单。</div></template>
      <template v-else><label class="textarea-label">学习笔记（自动保存到本地）</label><textarea class="learning-textarea" :value="state.notes['topic:'+selectedTopic] || ''" @input="state.notes['topic:'+selectedTopic]=$event.target.value" placeholder="记录你对该考点的理解、记忆口诀和易错点……"></textarea><div class="save-hint">✓ 自动保存 · 无需登录</div></template>
      <div class="lesson-footer"><button class="outline-btn" @click="navigate('practice');practiceSectionFilter=selectedTopic" :disabled="!allQuestions.some(q=>q.sectionId===selectedTopic)">练习本节题目 <span>→</span></button><button class="primary-btn" @click="toggleMastery(selectedTopic)">{{state.mastered.includes(selectedTopic)?'✓ 已掌握 · 点击取消':'标记为已掌握'}} <span v-html="icon('check')"></span></button></div><div class="lesson-next"><button :disabled="!prevTopic" @click="selectedTopic=prevTopic;readingTab='course'"><span>← 上一节</span><strong>{{topicTitle(prevTopic)||'没有了'}}</strong></button><button :disabled="!nextTopic" @click="selectedTopic=nextTopic;readingTab='course'"><span>下一节 →</span><strong>{{topicTitle(nextTopic)||'已经学完啦'}}</strong></button></div></article></div></template></template>
      <!-- 思维导图 -->
      <template v-else-if="activeView==='maps'"><div class="page-heading compact"><div><div class="eyebrow">VISUAL LEARNING</div><h1>知识图解实验室</h1><p>从课程知识点提炼的原创交互图形，点击节点查看释义，再一键跳转考点。</p></div></div><div class="module-notice"><span v-html="icon('info')"></span>独立整理的交互式图解，不复制或公开原版课程导图。图形可点击切换要点，完整知识树仍保留在下方。</div><div class="outline-chapter-chooser"><button v-for="ch in allChapterData" :key="ch.id" class="outline-chapter-button" :class="{active:selectedChapter===ch.id}" @click="selectedChapter=ch.id">第 {{String(ch.id).padStart(2,'0')}} 章 · {{ch.title}}</button></div><section v-if="currentChapterVisuals.length" class="visual-atlas-panel"><div class="atlas-header"><div><span>CHAPTER {{String(selectedChapter).padStart(2,'0')}}</span><h2>{{chapterTitle}} · 图解导航</h2><p>{{currentChapterVisuals.length}} 张图解，覆盖流程、关系、层次、对比与记忆结构。</p></div><span class="atlas-counter">{{currentChapterVisuals.length}} DIAGRAMS</span></div><div class="atlas-picker"><button v-for="(visual,i) in currentChapterVisuals" :key="visual.id" @click="visualFocusId=visual.id" :class="{'is-selected':visibleVisualDiagram?.id===visual.id}"><span class="atlas-number">{{String(i+1).padStart(2,'0')}}</span><span>{{visual.title}}</span><small>{{visual.topicId}}</small></button></div><exam-visual v-if="visibleVisualDiagram" :key="visibleVisualDiagram.id" :diagram="visibleVisualDiagram" @navigate="openKnowledge"></exam-visual></section><details class="knowledge-tree-fold"><summary>完整章节知识树 <span>（可点击跳转到对应小节）</span></summary><div v-if="currentChapterSections.length" class="mindmap-web"><div class="mindmap-center"><small>CHAPTER {{String(selectedChapter).padStart(2,'0')}}</small><strong>{{chapterTitle}}</strong><span>{{currentChapterTopicList.length}} 个知识小节</span></div><div class="mindmap-level-one" v-for="sec in currentChapterSections" :key="sec.id"><h3>{{sec.id}} {{sec.title}}</h3><div v-for="topic in sec.children" :key="topic.id" class="mindmap-topic"><button @click="openKnowledge(topic.id)"><span>{{topic.id}}</span>{{topic.title}} <b>↗</b></button><div class="mindmap-tags"><span v-for="(block,k) in (currentChapterData?.notes?.[topic.id]?.blocks||[]).slice(0,3)" :key="k">{{block.title}}</span></div></div></div></div></details><div v-if="!currentChapterSections.length" class="empty-inline">本章还没有导入学习资料，请先上传对应章节的讲义。</div></template>
      <!-- 题库 -->
      <template v-else-if="activeView==='practice' || activeView==='wrong' || activeView==='favorites'"><div class="page-heading compact"><div><div class="eyebrow">SMART PRACTICE</div><h1>{{activeView==='wrong'?'我的错题本':activeView==='favorites'?'收藏夹':'章节刷题'}}</h1><p>前八章共 275 道练习题（第七章 30 道，第八章 49 道选择题及 3 道判断题）。作答后可查看讲义参考答案、解析与页码。</p></div><button class="outline-btn" @click="navigate('exam')"><span v-html="icon('timer')"></span> 模拟考试</button></div><div v-if="activeView==='favorites' && state.starred.length" class="panel favorite-knowledge-panel"><div class="panel-heading"><div><h3>收藏的知识点</h3><p>点击返回对应知识小节或标题类考点</p></div><span class="fav-count">{{state.starred.length}} 项</span></div><div class="favorite-chip-list"><button v-for="id in state.starred" :key="id" @click="openSavedKnowledge(id)"><span v-html="icon('star-fill')"></span> {{favoriteTitle(id)}} <span>↗</span></button></div></div><div class="practice-toolbar panel"><div class="filter-field"><label>题目范围</label><select v-model="practiceFilter" @change="drillIndex=0"><option value="all">本章全部题目</option><option value="wrong">仅看错题</option><option value="favorite">仅看收藏题</option><option value="unanswered">尚未作答</option><option value="marked">资料带年份标记</option></select></div><div class="filter-field"><label>所属考点</label><select v-model="practiceSectionFilter" @change="drillIndex=0"><option value="all">全部考点</option><option v-for="s in currentChapterTopicList" :key="s.id" :value="s.id">{{s.id}} {{s.title}}</option></select></div><div class="filter-field"><label>当前章</label><select v-model.number="selectedChapter" @change="drillIndex=0;practiceSectionFilter='all'"><option v-for="c in EXAM_CHAPTERS" :value="c.id">{{String(c.id).padStart(2,'0')}} {{c.name}}</option></select></div><div class="filter-result">共 <strong>{{filteredQuestions.length}}</strong> 题</div></div>
      <div v-if="filteredQuestions.length" class="practice-layout"><section class="question-panel panel"><div class="question-meta"><span class="question-label">{{currentDrillQ.options.length===2?'判断题':'单项选择题'}}</span><span class="question-divider">·</span><span>{{currentDrillQ.sectionId}} {{topicTitle(currentDrillQ.sectionId)}}</span><span class="question-page">第 {{drillIndex+1}} / {{filteredQuestions.length}} 题</span></div><div class="q-progress"><div :style="{width:((drillIndex+1)/filteredQuestions.length*100)+'%'}"></div></div><div class="question-title"><span>Q{{String(currentDrillQ.number).padStart(2,'0')}}</span>{{currentDrillQ.title}}</div><div class="question-options"><button v-for="(opt,i) in currentDrillQ.options" :key="i" class="option" :class="optionClass(currentDrillQ,'ABCD'[i])" @click="answerDrill(currentDrillQ,'ABCD'[i])"><span class="option-letter">{{'ABCD'[i]}}</span><span>{{opt}}</span><span v-if="answerFor(currentDrillQ.id) && currentDrillQ.answer==='ABCD'[i]" class="option-result" v-html="icon('check')"></span><span v-else-if="answerFor(currentDrillQ.id)?.selected==='ABCD'[i] && currentDrillQ.answer!=='ABCD'[i]" class="option-result" v-html="icon('x')"></span></button></div><div v-if="answerFor(currentDrillQ.id)" class="answer-explanation" :class="answerFor(currentDrillQ.id).correct?'correct':'incorrect'"><div class="answer-heading"><span v-html="icon(answerFor(currentDrillQ.id).correct?'check-circle':'alert')"></span><strong>{{answerFor(currentDrillQ.id).correct?'回答正确！':'回答错误，继续加油'}}</strong><span>正确答案：{{currentDrillQ.answer}}</span></div><p>{{currentDrillQ.explanation || '请结合本章课程内容和原讲义进行复习。'}}</p><button class="inline-link" @click="openPdf(currentDrillQ.sourcePage)">查看讲义第 {{currentDrillQ.sourcePage}} 页 ↗</button></div><div class="q-actions"><div><button class="icon-text-btn" @click="toggleBookmark(currentDrillQ.id)"><span v-html="icon(state.bookmarked.includes(currentDrillQ.id)?'star-fill':'star')"></span>{{state.bookmarked.includes(currentDrillQ.id)?'已收藏':'收藏本题'}}</button><button v-if="state.wrongIds.includes(currentDrillQ.id)" class="icon-text-btn" @click="resolveWrong(currentDrillQ.id)"><span v-html="icon('check-circle')"></span> 移出错题本</button><button v-if="answerFor(currentDrillQ.id)" class="icon-text-btn" @click="redoDrill(currentDrillQ)"><span v-html="icon('refresh')"></span> 重新作答</button></div><div><button class="outline-btn" :disabled="drillIndex===0" @click="drillIndex--">上一题</button><button class="primary-btn" :disabled="drillIndex>=filteredQuestions.length-1" @click="drillIndex++">下一题 <span>→</span></button></div></div></section><aside class="question-side"><div class="panel question-side-panel"><h3>答题进度</h3><div class="answer-count"><strong>{{filteredQuestions.filter(q=>answerFor(q.id)).length}}</strong><span>/ {{filteredQuestions.length}} 已作答</span></div><div class="palette-grid"><button v-for="(q,i) in filteredQuestions" :key="q.id" @click="drillIndex=i" :title="'第'+q.number+'题'" :class="{'current':drillIndex===i,'is-answered':answerFor(q.id),'is-wrong':answerFor(q.id)&&!answerFor(q.id).correct}">{{i+1}}</button></div><div class="palette-legend"><span><i class="legend-current"></i> 当前</span><span><i class="legend-answered"></i> 正确</span><span><i class="legend-wrong"></i> 错误</span></div></div><div class="panel exercise-tip"><strong>资料使用说明</strong><p>题目与参考答案提取自讲义；年份标记沿用讲义原始标注，未逐题做官方真题溯源。</p></div></aside></div>
      <div v-else class="empty-panel"><span class="empty-illustration">✓</span><h2>{{practiceFilter==='wrong'?'还没有错题，很棒！':'当前筛选暂无题目'}}</h2><p>可以切换题目范围、所属考点或章节，重新开始练习。</p><button class="primary-btn" @click="practiceFilter='all';practiceSectionFilter='all';selectedChapter=1;drillIndex=0">查看第一章全部练习</button></div></template>
      <!-- 历年真题（原讲义年份标注） -->

      <!-- 模拟考试 -->
      <template v-else-if="activeView==='exam'"><div class="page-heading compact"><div><div class="eyebrow">MOCK EXAM</div><h1>模拟考试</h1><p>题目从已录入的题库中抽取，不会冒充真实官方试卷。</p></div></div><template v-if="!examActive && !lastExamReport"><div class="exam-launch panel"><span class="exam-launch-icon" v-html="icon('clipboard')"></span><h2>准备好检验学习成果了吗？</h2><p>选定题量后，系统随机抽题、限时作答、统一交卷评分，自动记录错题。</p><div class="exam-config"><label>试卷题量</label><select v-model.number="examCount"><option v-for="n in examCountOptions" :value="n">{{n}} 题 · {{Math.ceil(n*1.5)}} 分钟</option></select></div><div class="exam-metrics"><div><strong>{{allQuestions.length}}</strong><span>题库可用题数</span></div><div><strong>{{examCount}}</strong><span>本次出题数</span></div><div><strong>{{Math.ceil(examCount*1.5)}}</strong><span>考试时长 / 分钟</span></div></div><button class="primary-btn large" @click="startExam">开始模拟考试 <span>→</span></button></div></template>
      <template v-else-if="examActive"><div class="exam-bar panel"><div><strong>模拟测试 · {{examActive.questions.length}} 题</strong><span>已答 {{Object.keys(examActive.picks).length}} / {{examActive.questions.length}}</span></div><div class="exam-timer" :class="{'low':remainingSeconds<120}" v-html="icon('timer')"></div><strong class="time-string">{{formatTime(remainingSeconds)}}</strong><button class="outline-btn" @click="finishExam">提前交卷</button></div><div class="practice-layout"><section class="question-panel panel"><div class="question-meta">{{currentExamQ.options.length===2?'判断题':'选择题'}} <span class="question-page">{{examIndex+1}} / {{examActive.questions.length}}</span></div><div class="question-title"><span>Q{{examIndex+1}}</span>{{currentExamQ.title}}</div><div class="question-options"><button v-for="(op,i) in currentExamQ.options" :key="i" class="option" :class="{'selected-only':examActive.picks[currentExamQ.id]==='ABCD'[i]}" @click="examActive.picks[currentExamQ.id]='ABCD'[i]"><span class="option-letter">{{'ABCD'[i]}}</span>{{op}}</button></div><div class="q-actions"><div>考试模式不即时公布答案</div><div><button class="outline-btn" :disabled="examIndex===0" @click="examIndex--">上一题</button><button class="primary-btn" v-if="examIndex<examActive.questions.length-1" @click="examIndex++">下一题 →</button><button class="primary-btn" v-else @click="finishExam">提交试卷</button></div></div></section><aside class="question-side"><div class="panel question-side-panel"><h3>答题卡</h3><div class="palette-grid"><button v-for="(q,i) in examQuestionObjects" :key="q.id" @click="examIndex=i" :class="{'current':examIndex===i,'is-answered':examActive.picks[q.id]}">{{i+1}}</button></div><div class="save-hint">未作答题目交卷后计为错误</div></div></aside></div></template>

      <!-- 案例分析 -->
      <template v-else-if="activeView==='cases'"><div class="page-heading compact"><div><div class="eyebrow">CASE ANALYSIS</div><h1>案例分析</h1><p>为后续案例题预留独立模块，支持答题记录、案例知识点关联和复盘。</p></div></div><div class="module-notice"><span v-html="icon('info')"></span>已整理第 1–8 章知识点及配套选择题；原讲义未提供可直接整合的完整案例题与标准评分答案。此处保留答题工作区，不预置虚构案例。</div><div class="writing-layout"><section class="panel writing-panel"><h3>案例分析工作区</h3><p class="muted-text">后续上传案例题时，可在这里展示材料、分问、标准答案与评分要点。</p><label class="textarea-label">案例主题 / 题目编号</label><input class="form-input" v-model="state.caseDraft.title" placeholder="例如：项目进度与成本综合案例"/><label class="textarea-label">案例材料（手动粘贴）</label><textarea class="learning-textarea case-material" v-model="state.caseDraft.material" placeholder="将案例材料粘贴于此……"></textarea><label class="textarea-label">我的作答 / 复盘</label><textarea class="learning-textarea case-answer" v-model="state.caseDraft.answer" placeholder="从问题定位、原因分析、措施建议等角度作答……"></textarea><div class="writing-tools"><span class="save-hint">✓ 自动保存</span><button class="outline-btn" @click="downloadText('案例分析',state.caseDraft.title+'\n\n案例材料\n'+state.caseDraft.material+'\n\n我的作答\n'+state.caseDraft.answer)">导出文本</button></div></section><aside class="panel writing-guide"><h3>案例分析建议流程</h3><div v-for="(t,i) in ['识别考查的知识领域和题目要求','提取案例中的事实、角色、过程和问题','结合教材术语分点作答','核对结论、反思错因并沉淀模板']" class="guide-step"><span>{{i+1}}</span><p>{{t}}</p></div></aside></div></template>
      <!-- 论文 -->
      <template v-else-if="activeView==='essays'"><div class="page-heading compact"><div><div class="eyebrow">ESSAY WORKSHOP</div><h1>论文训练</h1><p>建立项目背景素材库、练习论文结构和知识领域的对应，写作记录保存在浏览器。</p></div></div><div class="module-notice"><span v-html="icon('info')"></span>这是论文练习编辑器，当前没有导入官方论文真题或参考范文。</div><div class="writing-layout"><section class="panel writing-panel"><div class="writing-heading"><h3>论文草稿</h3><span>{{state.essayDraft.body.length}} 字</span></div><label class="textarea-label">论文题目</label><input class="form-input" v-model="state.essayDraft.title" placeholder="如：论信息系统项目的风险管理"/><label class="textarea-label">正文</label><textarea class="learning-textarea essay-editor" v-model="state.essayDraft.body" placeholder="摘要：……\n\n项目背景：……\n\n管理过程：……\n\n经验总结：……"></textarea><div class="writing-tools"><span class="save-hint">✓ 自动保存</span><button class="outline-btn" @click="downloadText('论文草稿',state.essayDraft.title+'\n\n'+state.essayDraft.body)">导出 TXT</button></div></section><aside class="panel writing-guide"><h3>写作结构建议</h3><div v-for="(t,i) in ['摘要：简述项目及本人职责、管理目标','项目背景：规模、周期、技术、干系人','正文：按题目要求展开管理过程与实际举措','收尾：结果、问题反思与经验总结']" class="guide-step"><span>{{i+1}}</span><p>{{t}}</p></div><div class="writing-helper"><strong>可复用模块</strong><p>后续每个知识领域可单独关联一套论文写作素材、真实项目案例和范文练习。</p></div></aside></div></template>
      <!-- 学习统计 -->
      <template v-else-if="activeView==='progress'"><div class="page-heading compact"><div><div class="eyebrow">STUDY INSIGHTS</div><h1>学习统计</h1><p>学习痕迹在浏览器本地积累，帮助你安排下一轮复习。</p></div></div><div class="stat-grid progress-stat"><div class="stat-card" v-for="s in dashboardStats" :key="s.label"><div class="stat-head"><span class="stat-ico" :class="s.tone" v-html="icon(s.icon)"></span></div><div class="stat-value">{{s.value}}</div><div class="stat-name">{{s.label}}</div></div></div><div class="panel progress-visual-panel"><div class="panel-heading"><div><h3>学习表现对比</h3><p>以实际作答为依据，没有作答的章节不显示虚构正确率。</p></div></div><div class="progress-charts"><div v-for="s in visualChapterStats" :key="s.id" class="progress-chart-item"><div class="progress-chart-title"><strong>第 {{String(s.id).padStart(2,'0')}} 章 · {{s.name}}</strong><button @click="openChapter(s.id)">进入章节 ↗</button></div><div class="progress-chart-line"><span>掌握率</span><div><i class="bar-master" :style="{width:s.mastery+'%'}"></i></div><strong>{{s.mastery}}%</strong></div><div class="progress-chart-line"><span>答题正确率</span><div><i class="bar-accuracy" :style="{width:(s.answered?s.accuracy:0)+'%'}"></i></div><strong>{{s.answered?s.accuracy+'%':'暂无'}}</strong></div><small>{{s.mastered}}/{{s.topics}} 小节已掌握 · {{s.answered}} 道题已练习</small></div></div></div><div class="home-columns"><section class="panel"><div class="panel-heading"><div><h3>章节掌握情况</h3><p>按当前已录入的 {{allTopics.length}} 个知识小节统计</p></div><span class="strong-progress">{{masteryPercent}}%</span></div><div class="section-progress" v-for="s in allChapterData.flatMap(d=>d.sections||[])"><div><strong>{{s.id}} {{s.title}}</strong><span>{{s.children.filter(c=>state.mastered.includes(c.id)).length}}/{{s.children.length}}</span></div><div class="progress-track"><span :style="{width:s.children.filter(c=>state.mastered.includes(c.id)).length/s.children.length*100+'%'}"></span></div></div></section><section class="panel"><div class="panel-heading"><div><h3>答题反馈</h3><p>根据当前保留的最后一次练习作答统计</p></div></div><div class="accuracy-circle" :style="{'--pct':answerAccuracy+'%'}"><div><strong>{{answerAccuracy}}%</strong><span>练习正确率</span></div></div><div class="accuracy-legend"><span>已作答 {{answeredCount}} 道</span><span>错题本 {{state.wrongIds.length}} 道</span><span>模拟考试 {{state.exams.length}} 次</span></div></section></div><div class="panel history-panel"><div class="panel-heading"><div><h3>最近模拟考试</h3><p>按时间倒序保留历史记录</p></div></div><div v-if="!state.exams.length" class="empty-inline">暂无模拟考试记录。完成一次模拟考试后，这里将展示成绩。</div><div class="history-row" v-for="e in [...state.exams].reverse().slice(0,15)" :key="e.id"><span class="history-date">{{new Date(e.finishedAt).toLocaleString('zh-CN')}}</span><strong>{{e.score}} 分</strong><span>答对 {{e.correct}} / {{e.total}} 题</span></div></div></template>
      <!-- 搜索 -->
      <template v-else-if="activeView==='search'"><div class="page-heading compact"><div><div class="eyebrow">SEARCH YOUR KNOWLEDGE</div><h1>全站搜索</h1><p>搜索已录入的章节名称、知识小节、重点清单与练习题。</p></div></div><div class="search-big panel"><span v-html="icon('search')"></span><input v-model="searchQuery" placeholder="输入关键词，如：数字经济、车联网、数据资产化……"/></div><div class="search-count" v-if="searchQuery.trim()">找到 {{searchResults.length}} 条结果</div><div v-for="r in searchResults" :key="r.type+r.id" class="search-result panel" @click="openSearchResult(r)"><span class="search-result-type">{{r.type==='chapter'?'章节':r.type==='topic'?'小节':r.type==='question'?'练习':'考点'}}</span><div><strong>{{r.title}}</strong><p>{{r.desc}}</p></div><span>→</span></div><div v-if="!searchResults.length" class="empty-panel"><h3>{{searchQuery?'没有找到匹配内容':'输入一个关键词开始搜索'}}</h3></div></template>
      <!-- 设置和导入 -->
      <template v-else-if="activeView==='settings'"><div class="page-heading compact"><div><div class="eyebrow">DATA & PREFERENCES</div><h1>数据与设置</h1><p>无需服务端，所有学习记录只保存在当前设备当前浏览器。</p></div></div><div class="settings-grid"><section class="panel settings-panel"><h3>资料导入</h3><p>第 1–8 章已内置，可为第 9–24 章导入结构化 JSON。导入不会覆盖已有的学习记录。</p><div class="import-box"><span v-html="icon('upload')"></span><strong>导入章节 JSON</strong><small>支持章节标题、目录、考点、习题和解析</small><label class="primary-btn file-label">选择 JSON 文件<input type="file" accept=".json,application/json" @change="importDataFile" hidden/></label></div><button class="inline-link" @click="downloadTemplate">下载章节导入模板 JSON ↓</button><p v-if="importMessage" class="import-feedback" :class="{'error':importError}">{{importMessage}}</p></section><section class="panel settings-panel"><h3>个人学习数据</h3><p>导出本地学习记录可用于迁移设备或备份。导入记录会覆盖本地已有记录，请先备份。</p><div class="settings-actions"><button class="outline-btn" @click="exportProgress"><span v-html="icon('download')"></span> 导出学习记录</button><label class="outline-btn file-label"><span v-html="icon('upload')"></span> 导入学习记录<input type="file" accept=".json" hidden @change="importProgress" /></label><button class="danger-outline-btn" @click="clearProgress">清空学习记录</button></div></section><section class="panel settings-panel"><h3>外观偏好</h3><div class="setting-switch"><div><strong>深色模式</strong><small>切换舒适的阅读配色</small></div><button class="switch" :class="{'checked':state.settings.dark}" @click="state.settings.dark=!state.settings.dark"><span></span></button></div></section><section class="panel settings-panel"><h3>版本与数据说明</h3><div class="about-list"><div><span>网站版本</span><strong>v1.6 · 八章图解增强版 · 纯前端</strong></div><div><span>教材章节</span><strong>第 4 版 · 24 章</strong></div><div><span>已录入资料</span><strong>第 1–8 章 · 100 个知识小节 + 275 道题</strong></div><div><span>数据储存</span><strong>localStorage（本机）</strong></div><div><span>外部依赖</span><strong>Vue 3 已随项目打包</strong></div></div></section></div><div class="panel architecture-panel"><h3>后续章节扩展结构</h3><p>每章以 chapterId 为主键，各模块用统一编号关联，让同一知识点连接学习、真题、错题、案例与论文。</p><div class="architecture-flow"><div>章节<br/><strong>Chapter</strong></div><span>→</span><div>知识小节<br/><strong>Topics</strong></div><span>→</span><div>考点卡片<br/><strong>Notes</strong></div><span>→</span><div>题库 / 案例 / 论文<br/><strong>Practice</strong></div><span>→</span><div>复习记录<br/><strong>Progress</strong></div></div></div></template>
    </main>
    <footer class="app-footer"><span>高项研习社 · 专注信息系统项目管理师学习</span><span>第 1–8 章依据上传的讲义及导图独立整理 · 99 张交互式图解 · 年份沿用资料标记，未宣称全部为官方真题</span></footer>
  </div>
  <div v-if="toast" class="toast" role="status">{{toast}}</div>
</div>
<script src="./assets/vue.global.prod.js"></script><script src="./data/catalog.js"></script><script src="./data/content.js"></script><script src="./data/chapter01.js"></script><script src="./data/chapter02.js"></script><script src="./data/chapter03.js"></script><script src="./data/chapter04.js"></script><script src="./data/chapter05.js"></script><script src="./data/chapter06.js"></script><script src="./data/chapter07.js"></script><script src="./data/chapter08.js"></script><script src="./data/visuals.js?v=1.6"></script><script src="./assets/visuals-ui.js?v=1.6"></script><script src="./assets/app.js?v=1.6"></script>
</body></html>
