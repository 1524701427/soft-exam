<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#101b38" />
<meta name="description" content="信息系统项目管理师24章学习平台：章节知识点、思维导图、练习题、错题本、模拟考试、案例与论文。" />
<title>高项研习社 · 信息系统项目管理师学习平台</title>
<link rel="stylesheet" href="./assets/style.css?v=1.9" />
<link rel="stylesheet" href="./assets/visuals.css?v=2.0" />
</head>
<body>
<div id="app" v-cloak :class="{'dark-mode':state.settings.dark}">
  <aside class="sidebar" :class="{'mobile-open':sidebarOpen}">
    <div class="brand"><div class="brand-mark">研<span>·</span></div><div><strong>高项研习社</strong><small>信息系统项目管理师</small></div><button class="mobile-close" @click="sidebarOpen=false">✕</button></div>
    <div class="sidebar-scroll">
      <div class="nav-label">学习工作台</div>
      <button v-for="item in navMain" :key="item.id" class="nav-item" :class="{'active':activeView===item.id}" @click="navigate(item.id)"><span class="nav-icon" v-html="icon(item.icon)"></span><span>{{item.label}}</span><span v-if="item.id==='wrong' && state.wrongIds.length" class="nav-pill">{{state.wrongIds.length}}</span></button>
      <div class="nav-label nav-gap">学习资源</div>
      <button v-for="item in navResources" :key="item.id" class="nav-item" :class="{'active':activeView===item.id}" @click="navigate(item.id)"><span class="nav-icon" v-html="icon(item.icon)"></span><span>{{item.label}}</span></button>
      <div class="sidebar-divider"></div>
      <div class="side-section-title"><span>教材章节</span><button @click="navigate('chapters')" title="查看24章">全部 <span class="arrow-small">›</span></button></div>
      <div v-for="g in EXAM_CATALOG" :key="g.group" class="chapter-side-group"><div class="chapter-group-label">{{g.group}}</div><button v-for="n in g.chapters" :key="n" class="chapter-mini" :class="{'selected':selectedChapter===getChapterId(n)}" @click="openChapter(getChapterId(n))"><span class="chapter-mini-no">{{String(getChapterId(n)).padStart(2,'0')}}</span><span class="ellipsis">{{n}}</span><span v-if="isChapterReady(getChapterId(n))" class="side-dot"></span></button></div>
    </div>
    <div class="sidebar-bottom"><div class="user-avatar">学</div><div class="user-info"><strong>我的学习空间</strong><small>仅保存在当前浏览器</small></div><button class="side-gear" title="设置和数据管理" @click="navigate('settings')" v-html="icon('settings')"></button></div>
  </aside>
  <div v-if="sidebarOpen" class="mobile-scrim" @click="sidebarOpen=false"></div>
  <div class="app-shell">
    <header class="topbar"><button class="mobile-toggle" @click="sidebarOpen=true" v-html="icon('menu')"></button><div class="breadcrumbs"><span>备考中心</span><span class="bread-sep">/</span><strong>{{viewTitle}}</strong></div><div class="top-right"><div class="global-search"><span v-html="icon('search')"></span><input v-model="searchQuery" @keydown.enter="performSearch" placeholder="搜索章节、知识点、题目..." /><kbd @click="performSearch">↵</kbd></div><button class="top-icon-btn" title="切换深色模式" @click="state.settings.dark=!state.settings.dark" v-html="icon(state.settings.dark?'sun':'moon')"></button><span class="top-avatar">学</span></div></header>
    <main class="main-content">
      <!-- 首页 -->
      <template v-if="activeView==='home'">
        <div class="page-heading"><div><div class="eyebrow"><span class="tiny-dot"></span> 2026 软考高级 · 备考空间</div><h1>每一个知识点，都算数。<span class="wave">✦</span></h1><p>把繁杂的教材变成清晰的学习路径，从理解考点到熟练答题。</p></div><div class="date-pill"><span v-html="icon('calendar')"></span>{{todayLabel}}</div></div>
        <div class="hero-banner"><div class="hero-content"><div class="hero-kicker">YOUR STUDY JOURNEY · 426 INTERACTIVE DIAGRAMS</div><h2>继续学习，向拿证更近一步</h2><p>24 章全部录入 · 426 张原创互动图解与 800 道题</p><div class="hero-actions"><button class="primary-light-btn" @click="openKnowledge(recommendedTopic)">接着学 <span>→</span></button><button class="ghost-light-btn" @click="navigate('practice')">去刷题 <span>↗</span></button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="floating-card card-1">✓ <span>知识点掌握</span></div><div class="floating-card card-2">✦ <span>每日进步</span></div><div class="book-graphic"><span>高项</span><small>STUDY</small></div><div class="floating-star s1">✦</div><div class="floating-star s2">✧</div></div></div>
        <section class="chapter-art-rail" aria-label="新章节图解概览">
<button class="chapter-art-card" @click="openVisualInMaps('c24-v01')"><img src="./assets/chapter24-overview.svg" alt="第24章法律法规与标准规范原创知识结构图" loading="lazy"><span><strong>第 24 章 · 法律法规与标准规范</strong><small>21 张原创交互图解 · 点击学习 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c23-v01')"><img src="./assets/chapter23-overview.svg" alt="第23章组织通用管理原创知识结构图" loading="lazy"><span><strong>第 23 章 · 组织通用管理</strong><small>22 张原创交互图解 · 点击学习 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c22-v01')"><img src="./assets/chapter22-overview.svg" alt="第22章组织通用治理原创知识结构图" loading="lazy"><span><strong>第 22 章 · 组织通用治理</strong><small>16 张原创交互图解 · 点击学习 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c21-v01')"><img src="./assets/chapter21-overview.svg" alt="第21章项目管理科学基础原创知识结构图" loading="lazy"><span><strong>第 21 章 · 项目管理科学基础</strong><small>24 张原创交互图解 · 点击学习 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c20-v01')"><img src="./assets/chapter20-overview.svg" alt="第20章高级项目管理原创知识概览图" loading="lazy"><span><strong>第 20 章 · 高级项目管理</strong><small>22 张可交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c19-v01')"><img src="./assets/chapter19-overview.svg" alt="第19章配置与变更管理原创知识概览图" loading="lazy"><span><strong>第 23 章 · 组织通用管理</strong><small>20 张可交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c18-v01')"><img src="./assets/chapter18-overview.svg" alt="第18章项目绩效域原创知识概览图" loading="lazy"><span><strong>第 18 章 · 项目绩效域</strong><small>28 张可交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c17-v01')"><img src="./assets/chapter17-overview.svg" alt="第17章干系人管理原创知识概览图" loading="lazy"><span><strong>第 17 章 · 干系人管理</strong><small>19 张可交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c16-v01')"><img src="./assets/chapter16-overview.svg" alt="第16章采购管理的原创流程图" loading="lazy"><span><strong>第 16 章 · 采购管理</strong><small>18 张交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c15-v01')"><img src="./assets/chapter15-overview.svg" alt="第15章风险管理的原创流程图" loading="lazy"><span><strong>第 15 章 · 风险管理</strong><small>20 张交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c14-v01')"><img src="./assets/chapter14-overview.svg" alt="第14章沟通管理的原创流程图" loading="lazy"><span><strong>第 14 章 · 沟通管理</strong><small>14 张交互图解 · 点击进入 →</small></span></button>
<button class="chapter-art-card" @click="openVisualInMaps('c13-v01')"><img src="./assets/chapter13-overview.svg" alt="第13章资源管理的原创流程图" loading="lazy"><span><strong>第 13 章 · 资源管理</strong><small>18 张交互图解 · 点击进入 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c12-qc-chain')"><img src="./assets/chapter12-overview.svg" alt="第12章质量管理知识结构图" loading="lazy"><span><strong>第 12 章 · 质量管理</strong><small>18 张原创交互图解 · 点击探索 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c11-budget-stair')"><img src="./assets/chapter11-overview.svg" alt="第11章成本管理知识结构图" loading="lazy"><span><strong>第 11 章 · 成本管理</strong><small>20 张原创交互图解 · 点击探索 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c10-network-critical')"><img src="./assets/chapter10-overview.svg" alt="第10章进度管理知识结构图" loading="lazy"><span><strong>第 10 章 · 进度管理</strong><small>24 张原创交互图解 · 点击探索 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c9-scope-bridge')"><img src="./assets/chapter09-overview.svg" alt="第9章范围管理知识结构图" loading="lazy"><span><strong>第 09 章 · 范围管理</strong><small>23 张原创交互图解 · 点击探索 →</small></span></button>

          <button class="chapter-art-card" @click="openVisualInMaps('c8-seven-processes')"><img src="./assets/chapter08-overview.svg" alt="第八章整合管理：七大过程、章程、项目计划、绩效报告与整体变更控制" loading="lazy"><span><strong>第 08 章 · 整合管理</strong><small>15 个知识小节 · 52 道练习 · 24 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c7-five-feasibility')"><img src="./assets/chapter07-overview.svg" alt="第七章立项管理：建议、可行性研究、项目评估及决策" loading="lazy"><span><strong>第 07 章 · 立项管理</strong><small>6 个知识小节 · 30 道习题 · 13 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c5-model')"><img src="./assets/chapter05-overview.svg" alt="第五章信息系统工程，软件、数据、集成与安全四条学习主线" loading="lazy"><span><strong>第 05 章 · 信息系统工程</strong><small>20 个知识小节 · 45 道习题 · 16 张新增图解　点击看图 →</small></span></button>
          <button class="chapter-art-card" @click="openVisualInMaps('c6-principles')"><img src="./assets/chapter06-overview.svg" alt="第六章项目管理概论，项目要素、项目经理、原则与价值交付主线" loading="lazy"><span><strong>第 06 章 · 项目管理概论</strong><small>17 个知识小节 · 25 道习题 · 15 张新增图解　点击看图 →</small></span></button>
        </section>
        <div class="stat-grid"><div class="stat-card" v-for="stat in dashboardStats" :key="stat.label"><div class="stat-head"><span class="stat-ico" :class="stat.tone" v-html="icon(stat.icon)"></span><span class="stat-desc">{{stat.caption}}</span></div><div class="stat-value">{{stat.value}}<span v-if="stat.unit">{{stat.unit}}</span></div><div class="stat-name">{{stat.label}}</div></div></div>
        <section class="panel study-analytics-panel"><div class="panel-heading"><div><h3>24章学习热力图 <span class="chart-mini-icon">✦ VISUAL</span></h3><p>每章展示真实的掌握率与练习正确率，点选章节即可继续学习</p></div><button class="text-link" @click="navigate('progress')">查看学习分析 →</button></div><div class="study-analytics-body"><div class="study-ring" :style="{'--pct':masteryPercent+'%'}"><div><strong>{{masteryPercent}}%</strong><span>总体掌握率</span></div></div><div class="chapter-analytics-bars"><button class="chapter-analytics-row" v-for="s in visualChapterStats" :key="s.id" @click="openChapter(s.id)"><span class="analytics-row-label"><b>CH {{String(s.id).padStart(2,'0')}}</b>{{s.name}}</span><span class="analytics-row-metrics"><span class="analytics-track"><i :style="{width:s.mastery+'%'}"></i></span><strong>{{s.mastery}}%</strong><small>正确率 {{s.answered?s.accuracy+'%':'—'}} · {{s.answered}}题</small></span></button></div></div></section><div class="home-columns"><section class="panel current-progress-panel"><div class="panel-heading"><div><h3>正在学习的章节</h3><p>从整体概览到逐节理解，有重点地推进</p></div><button class="text-link" @click="navigate('chapters')">查看全部章节 <span>→</span></button></div><div class="new-chapter-banner"><span>全部章节已上线 · 第 24 章 法规与标准</span><button @click="openChapter(24)">学习第二十四章 →</button></div><div class="new-chapter-banner secondary-chapter-banner"><span>第 23 章 · 组织通用管理</span><button @click="openChapter(23)">学习第二十三章 →</button></div><div class="new-chapter-banner secondary-chapter-banner"><span>第 21 章 · 项目管理科学基础</span><button @click="openChapter(21)">练习计算专题 →</button></div><div class="current-chapter"><div class="chapter-symbol">01</div><div class="current-chapter-info"><div class="chapter-type">第一部分 · 信息技术与信息系统</div><h4>第 01 章 · 信息化发展</h4><div class="progress-meta"><span>已录入知识点整体掌握</span><strong>{{masteredCount}} / {{allTopics.length}}</strong></div><div class="progress-track"><div :style="{width:masteryPercent+'%'}"></div></div></div><button class="round-next" @click="openKnowledge(recommendedTopic)" title="继续学习" v-html="icon('arrow-right')"></button></div><div class="section-summary-list"><button v-for="s in EXAM_SECTIONS" :key="s.id" @click="openKnowledge(s.children.find(c=>!state.mastered.includes(c.id))?.id || s.children[0].id)" class="section-summary-row"><span class="sec-num">{{s.id}}</span><span class="sec-name">{{s.title}}</span><span class="section-count">{{s.children.filter(c=>state.mastered.includes(c.id)).length}}/{{s.children.length}}</span><span class="mini-arrow">›</span></button></div></section>
        <section class="panel quick-panel"><div class="panel-heading"><div><h3>快捷学习</h3><p>选择一种适合当下的学习方式</p></div></div><div class="quick-grid"><button v-for="a in quickActions" :key="a.view" class="quick-card" @click="navigate(a.view)"><span class="quick-icon" :class="a.tone" v-html="icon(a.icon)"></span><strong>{{a.name}}</strong><small>{{a.desc}}</small><span class="quick-enter">↗</span></button></div><div class="study-tip"><div class="tip-icon">✦</div><div><strong>今日学习提示</strong><p>全24章已开放。建议先在第21章完成七类计算题互动实验，再复习第22、23章组织治理与管理，最后用第24章法规时间轴记忆易混数字。</p></div></div></section></div>
        <div class="home-columns bottom-columns"><section class="panel"><div class="panel-heading"><div><h3>24 章学习路线</h3><p>教材四大模块 · 统一组织学习、练习与复习</p></div><button class="text-link" @click="navigate('chapters')">章节总览 →</button></div><div class="roadmap-groups"><div v-for="(g,i) in EXAM_CATALOG" class="roadmap-row" :key="g.group"><span class="roadmap-index" :class="g.color">{{String(i+1).padStart(2,'0')}}</span><div><strong>{{g.group}}</strong><small>{{g.chapters.length}} 个章节</small></div><div class="roadmap-track"><span :style="{width: groupMasteryPercent(g)+'%'}"></span></div></div></div></section><section class="panel source-panel"><div class="panel-heading"><div><h3>本章资料</h3><p>已录入知识点、考点与章节练习</p></div></div><div class="source-note">本学习站内置原创交互式知识图解和自主整理的文字要点；不包含原始授课 PDF 及原版导图图片。习题答案沿用讲义参考答案，年份标记未经官方真题逐条核验。</div></section></div>
      </template>
      <!-- 章节管理 -->
      <template v-else-if="activeView==='chapters'"><div class="page-heading compact"><div><div class="eyebrow">THE LEARNING ROADMAP</div><h1>教材章节<span class="title-light"> · 24 章</span></h1><p>按第 4 版教材结构组织，章节内容可独立追加，学习记录不会被覆盖。</p></div><button class="outline-btn" @click="navigate('settings')"><span v-html="icon('upload')"></span> 导入章节数据</button></div><div class="overview-strip"><div><strong>24</strong><span>章节总数</span></div><div><strong>{{availableChapterCount}}</strong><span>已录入内容</span></div><div><strong>{{masteredCount}}</strong><span>已掌握知识小节</span></div><div><strong>{{allQuestions.length}}</strong><span>已录入练习题</span></div></div><div v-for="group in EXAM_CATALOG" :key="group.group" class="catalog-section"><div class="catalog-group-heading"><span class="category-bar" :class="group.color"></span><h2>{{group.group}}</h2><small>{{group.chapters.length}} 章</small></div><div class="chapter-card-grid"><button v-for="name in group.chapters" :key="name" class="chapter-card" :class="{'is-ready':isChapterReady(getChapterId(name))}" @click="openChapter(getChapterId(name))"><div class="chapter-card-top"><span class="chapter-card-number">CH {{String(getChapterId(name)).padStart(2,'0')}}</span><span class="ready-label" :class="{'muted':!isChapterReady(getChapterId(name))}">{{isChapterReady(getChapterId(name))?'已录入':'待导入'}}</span></div><h3>{{name}}</h3><div class="chapter-card-bottom"><span>{{chapterCardSummary(getChapterId(name))}}</span><span class="chapter-open-arrow" v-html="icon('arrow-up-right')"></span></div></button></div></div></template>
      <!-- 知识点 -->
      <template v-else-if="activeView==='knowledge'"><div class="page-heading compact"><div><div class="eyebrow">CHAPTER {{String(selectedChapter).padStart(2,'0')}} / KNOWLEDGE</div><h1>{{chapterTitle}}</h1><p>先搭建知识框架，再通过重点记忆与原题练习巩固。</p></div><button class="outline-btn" @click="navigate('maps')"><span v-html="icon('map')"></span> 查看交互图解</button></div>
      <div v-if="!currentChapterSections.length" class="empty-panel"><span class="empty-illustration">▤</span><h2>第 {{selectedChapter}} 章内容尚未录入</h2><p>章节目录已配置。可在「数据与设置」中导入该章的知识点与题目；不会自动生成未经核对的教材知识。</p><button class="primary-btn" @click="navigate('settings')">去导入资料</button></div>
      <template v-else><div class="chapter-visual-overview"><div class="visual-overview-summary"><span class="visual-overview-label">CHAPTER OVERVIEW</span><strong>{{currentChapterSections.length}} 个大节 · {{currentChapterTopicList.length}} 小节 · {{currentChapterVisuals.length}} 张图解</strong><div class="visual-overview-track"><span :style="{width:chapterMasteryPercent+'%'}"></span></div></div><div class="visual-overview-links"><button v-for="visual in currentChapterVisuals.slice(0,5)" :key="visual.id" @click="openVisualInMaps(visual.id)"><span>◈</span>{{visual.title}}<b>↗</b></button><button class="visual-more" @click="navigate('maps')">全部图解 →</button></div></div><div class="learning-layout"><aside class="learning-outline panel"><div class="outline-heading"><strong>本章目录</strong><small>{{currentChapterTopicList.length}} 个知识小节</small></div><div class="chapter-vertical-progress"><div :style="{width:chapterMasteryPercent+'%'}"></div></div><div v-for="sec in currentChapterSections" :key="sec.id" class="outline-group"><button class="outline-parent" @click="toggleSectionCollapse(sec.id)"><span>{{sec.id}} {{sec.title}}</span><span :class="{'rotated':!openSectionGroups.includes(sec.id)}" v-html="icon('chevron-down')"></span></button><div v-if="openSectionGroups.includes(sec.id)"><button v-for="t in sec.children" :key="t.id" class="outline-child" :class="{'outline-active':selectedTopic===t.id}" @click="selectedTopic=t.id;readingTab='course'"><span class="status-circle" :class="{'is-done':state.mastered.includes(t.id)}">{{state.mastered.includes(t.id)?'✓':''}}</span><span class="ellipsis">{{t.id}} {{t.title}}</span></button></div></div><button class="outline-question-btn" @click="navigate('practice')"><span v-html="icon('clipboard')"></span> 本章刷题训练 <span>→</span></button></aside>
      <article class="lesson-area"><div class="lesson-topline"><div><span class="lesson-id">{{selectedTopic}}</span><span class="lesson-label">知识精讲</span></div><div class="lesson-actions"><button class="icon-text-btn" @click="toggleStar('topic:'+selectedTopic)"><span v-html="icon(state.starred.includes('topic:'+selectedTopic)?'star-fill':'star')"></span>{{state.starred.includes('topic:'+selectedTopic)?'已收藏':'收藏'}}</button><button class="icon-text-btn" @click="openPdf(currentTopicPage)"><span v-html="icon('external')"></span> 资料 P{{currentTopicPage}}</button></div><small v-if="currentNote?.sourceDocument" class="lesson-source-document">来自：{{currentNote.sourceDocument}}</small></div><h2 class="lesson-title">{{currentTopicTitle}}</h2><p class="lesson-lead">{{currentNote?.lead || '该节内容已建立，待补充学习资料。'}}</p><div class="lesson-tabs"><button :class="{'on':readingTab==='course'}" @click="readingTab='course'">考点精讲</button><button :class="{'on':readingTab==='highlights'}" @click="readingTab='highlights'">标题类必背 <span>{{currentSectionHighlights.length}}</span></button><button :class="{'on':readingTab==='notes'}" @click="readingTab='notes'">我的笔记</button></div>

      <template v-else><label class="textarea-label">学习笔记（自动保存到本地）</label><textarea class="learning-textarea" :value="state.notes['topic:'+selectedTopic] || ''" @input="state.notes['topic:'+selectedTopic]=$event.target.value" placeholder="记录你对该考点的理解、记忆口诀和易错点……"></textarea><div class="save-hint">✓ 自动保存 · 无需登录</div></template>
      <div class="lesson-footer"><button class="outline-btn" @click="navigate('practice');practiceSectionFilter=selectedTopic" :disabled="!allQuestions.some(q=>q.sectionId===selectedTopic)">练习本节题目 <span>→</span></button><button class="primary-btn" @click="toggleMastery(selectedTopic)">{{state.mastered.includes(selectedTopic)?'✓ 已掌握 · 点击取消':'标记为已掌握'}} <span v-html="icon('check')"></span></button></div><div class="lesson-next"><button :disabled="!prevTopic" @click="selectedTopic=prevTopic;readingTab='course'"><span>← 上一节</span><strong>{{topicTitle(prevTopic)||'没有了'}}</strong></button><button :disabled="!nextTopic" @click="selectedTopic=nextTopic;readingTab='course'"><span>下一节 →</span><strong>{{topicTitle(nextTopic)||'已经学完啦'}}</strong></button></div></article></div></template></template>
      <!-- 思维导图 -->
      <template v-else-if="activeView==='maps'"><div class="page-heading compact"><div><div class="eyebrow">VISUAL LEARNING</div><h1>知识图解实验室</h1><p>从课程知识点提炼的原创交互图形，点击节点查看释义，再一键跳转考点。</p></div></div><div class="module-notice"><span v-html="icon('info')"></span>独立整理的交互式图解，不复制或公开原版课程导图。图形可点击切换要点，完整知识树仍保留在下方。</div><div class="outline-chapter-chooser"><button v-for="ch in allChapterData" :key="ch.id" class="outline-chapter-button" :class="{active:selectedChapter===ch.id}" @click="selectedChapter=ch.id">第 {{String(ch.id).padStart(2,'0')}} 章 · {{ch.title}}</button></div><section v-if="currentChapterVisuals.length" class="visual-atlas-panel"><div class="atlas-header"><div><span>CHAPTER {{String(selectedChapter).padStart(2,'0')}}</span><h2>{{chapterTitle}} · 图解导航</h2><p>{{currentChapterVisuals.length}} 张图解，覆盖流程、关系、层次、对比与记忆结构。</p></div><span class="atlas-counter">{{currentChapterVisuals.length}} DIAGRAMS</span></div><div class="atlas-picker"><button v-for="(visual,i) in currentChapterVisuals" :key="visual.id" @click="visualFocusId=visual.id" :class="{'is-selected':visibleVisualDiagram?.id===visual.id}"><span class="atlas-number">{{String(i+1).padStart(2,'0')}}</span><span>{{visual.title}}</span><small>{{visual.topicId}}</small></button></div><exam-visual v-if="visibleVisualDiagram" :key="visibleVisualDiagram.id" :diagram="visibleVisualDiagram" @navigate="openKnowledge"></exam-visual></section>
        <!-- 第10章：可编辑关键路径网络图 -->
        <section v-if="selectedChapter===10" class="panel calc-lab" aria-label="关键路径动态推演">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · CPM</span><h3>关键路径动态推演</h3><p>调整示例活动持续时间，实时查看 ES、EF、LS、LF、总浮动时间与关键路径。数据为演示，不代表真实项目。</p></div><div class="calc-result"><small>项目最短工期</small><strong>{{networkSchedule.total}} <span>天</span></strong></div></div>
          <div class="network-inputs"><label v-for="node in networkSchedule.nodes" :key="node.id"><span>活动 {{node.id}}</span><input type="number" min="1" max="99" v-model.number="networkDurations[node.id]" aria-label="活动持续时间（天）"/><small>天</small></label></div>
          <div class="network-diagram-scroll"><svg viewBox="0 0 930 290" class="network-chart" role="img" aria-label="六个活动构成的项目进度网络，橙色表示关键路径"><defs><marker id="arrowNetwork" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#8BA3C7"/></marker><marker id="arrowCritical" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#E58F4B"/></marker></defs><path v-for="link in networkSchedule.links" :key="link.id" :d="link.d" fill="none" :stroke="link.critical?'#E58F4B':'#8BA3C7'" :stroke-width="link.critical?4:2.4" :marker-end="link.critical?'url(#arrowCritical)':'url(#arrowNetwork)'" stroke-linecap="round"/><g v-for="node in networkSchedule.nodes" :key="node.id"><rect :x="node.x-45" :y="node.y-30" width="90" height="62" rx="14" :fill="node.slack===0?'#FFEACB':'#E8F1FF'" :stroke="node.slack===0?'#E6A25E':'#8BAEE1'" stroke-width="2"/><text :x="node.x" :y="node.y-3" text-anchor="middle" font-size="21" font-weight="700" fill="#233555">{{node.id}} · {{node.duration}}天</text><text :x="node.x" :y="node.y+21" text-anchor="middle" font-size="14" fill="#425778">TF {{node.slack}}</text></g></svg></div>
          <div class="network-table-wrap"><table class="calc-table"><thead><tr><th>活动</th><th>持续</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>总浮动 TF</th></tr></thead><tbody><tr v-for="node in networkSchedule.nodes" :key="node.id" :class="{'critical-row':node.slack===0}"><td><b>{{node.id}}</b><span v-if="node.slack===0"> · 关键</span></td><td>{{node.duration}}</td><td>{{node.es}}</td><td>{{node.ef}}</td><td>{{node.ls}}</td><td>{{node.lf}}</td><td>{{node.slack}}</td></tr></tbody></table></div>
          <p class="calc-hint">正推 ES、EF；逆推 LS、LF。TF = LS − ES = LF − EF。橙色活动构成关键路径；多条关键路径可能同时存在。</p>
        </section>
        <!-- 第11章：挣值计算器 -->
        <section v-if="selectedChapter===11" class="panel calc-lab" aria-label="挣值EVM交互计算器">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · EVM</span><h3>挣值分析计算实验室</h3><p>修改示例 PV、EV、AC、BAC 即时计算成本和进度绩效。以下为演示数据，可直接输入自己的案例题数值。</p></div><div class="calc-result"><small>成本偏差 CV</small><strong :class="evmResult.cv<0?'calc-negative':''">{{displayNum(evmResult.cv)}} <span>万元</span></strong></div></div>
          <div class="evm-input-grid"><label v-for="field in [{key:'pv',label:'PV 计划价值'},{key:'ev',label:'EV 挣值'},{key:'ac',label:'AC 实际成本'},{key:'bac',label:'BAC 完工预算'}]" :key="field.key"><span>{{field.label}}</span><div><input type="number" min="0" step="1" v-model.number="evmValues[field.key]" :aria-label="field.label"/><small>万元</small></div></label></div>
          <div class="evm-bars"><div v-for="b in [{key:'pv',title:'PV 计划'},{key:'ev',title:'EV 已挣'},{key:'ac',title:'AC 实际'}]" :key="b.key" class="evm-bar-row"><span>{{b.title}}</span><div><i :class="'evm-'+b.key" :style="{width:Math.min(100,Math.max(0,evmValues[b.key]/Math.max(1,evmValues.bac)*100))+'%'}"></i></div><strong>{{displayNum(evmValues[b.key])}} 万</strong></div></div>
          <div class="calc-tiles"><div><small>CV = EV − AC</small><strong :class="evmResult.cv<0?'calc-negative':'calc-positive'">{{displayNum(evmResult.cv)}}</strong><span>{{evmResult.cv<0?'成本超支':evmResult.cv>0?'成本节约':'成本符合'}}</span></div><div><small>SV = EV − PV</small><strong :class="evmResult.sv<0?'calc-negative':'calc-positive'">{{displayNum(evmResult.sv)}}</strong><span>{{evmResult.sv<0?'进度落后':evmResult.sv>0?'进度提前':'进度符合'}}</span></div><div><small>CPI = EV / AC</small><strong>{{displayNum(evmResult.cpi)}}</strong><span>小于1表示成本效率不佳</span></div><div><small>SPI = EV / PV</small><strong>{{displayNum(evmResult.spi)}}</strong><span>小于1表示进度落后</span></div></div>
          <div class="forecast-control"><label for="evm-forecast">完工估算假设</label><select id="evm-forecast" v-model="evmForecastMode"><option value="typical">典型偏差：后续继续保持当前CPI</option><option value="atypical">非典型偏差：当前偏差不再重复</option></select></div><div class="calc-tiles calc-forecast"><div><small>EAC 完工估算</small><strong>{{displayNum(evmResult.eac)}}</strong><span>{{evmForecastMode==='typical'?'BAC / CPI':'AC + (BAC − EV)'}}</span></div><div><small>ETC 完工尚需</small><strong>{{displayNum(evmResult.etc)}}</strong><span>EAC − AC</span></div><div><small>VAC 完工偏差</small><strong>{{displayNum(evmResult.vac)}}</strong><span>BAC − EAC</span></div><div><small>TCPI 基于BAC</small><strong>{{displayNum(evmResult.tcpi)}}</strong><span>(BAC − EV) / (BAC − AC)</span></div></div><p class="calc-hint">数值单位：万元。若除数为零或为负且不适于原预算测算，显示“—”；EAC预测须根据题目给定的偏差假设选择。</p>
        </section>

        <!-- 第14章：沟通渠道数 -->
        <section v-if="selectedChapter===14" class="panel calc-lab" aria-label="沟通渠道计算实验室">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · COMMUNICATION</span><h3>沟通渠道计算实验室</h3><p>项目沟通渠道数 n(n−1)/2。调整参与人数，观察协作复杂度怎样增加。</p></div><div class="calc-result"><small>潜在沟通渠道</small><strong>{{communicationChannels.channels}} <span>条</span></strong></div></div>
          <div class="evm-input-grid"><label><span>参与人数 n</span><div><input type="number" min="2" max="500" step="1" v-model.number="communicationPeople" aria-label="沟通参与人数"/><small>人</small></div></label></div>
          <div class="calc-tiles"><div><small>参与人数</small><strong>{{communicationChannels.people}}</strong><span>n</span></div><div><small>沟通渠道</small><strong>{{communicationChannels.channels}}</strong><span>n × (n−1) / 2</span></div><div><small>再增加1人</small><strong>+{{communicationChannels.additional}}</strong><span>新增 n 条渠道</span></div></div>
          <p class="calc-hint">这是理论上的两两联系数量，不代表实际项目必须建立全部渠道；适合讲义第18页的沟通渠道选择题。</p>
        </section>
        <!-- 第15章：风险EMV -->
        <section v-if="selectedChapter===15" class="panel calc-lab" aria-label="风险预期货币价值计算器">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · RISK EMV</span><h3>风险预期货币价值（EMV）</h3><p>输入独立的机会和威胁情景，按概率加权计算期望金额。例题数值为演示。</p></div><div class="calc-result"><small>净期望值</small><strong :class="riskCalcResult.net<0?'calc-negative':''">{{displayNum(riskCalcResult.net)}} <span>万元</span></strong></div></div>
          <div class="evm-input-grid"><label v-for="field in [{key:'chance',label:'机会发生概率',unit:'0~1',step:0.05},{key:'gain',label:'机会收益',unit:'万元',step:1},{key:'threatChance',label:'威胁发生概率',unit:'0~1',step:0.05},{key:'loss',label:'威胁损失',unit:'万元',step:1},{key:'investment',label:'方案初始成本',unit:'万元',step:1}]" :key="field.key"><span>{{field.label}}</span><div><input type="number" min="0" :max="field.unit==='0~1'?1:100000" :step="field.step" v-model.number="riskCalc[field.key]" :aria-label="field.label"/><small>{{field.unit}}</small></div></label></div>
          <div class="calc-tiles"><div><small>机会 EMV</small><strong class="calc-positive">+{{displayNum(riskCalcResult.positive)}}</strong><span>机会概率 × 收益</span></div><div><small>威胁 EMV</small><strong class="calc-negative">−{{displayNum(riskCalcResult.negative)}}</strong><span>威胁概率 × 损失</span></div><div><small>净 EMV</small><strong>{{displayNum(riskCalcResult.net)}}</strong><span>机会 − 威胁 − 初始成本</span></div></div>
          <p class="calc-hint">两项风险分别计算加权期望后相加；是否选择方案还须结合风险偏好、可行性和其他因素。讲义第59至64页。</p>
        </section>
        <!-- 第16章：采购激励合同计算器 -->
        <section v-if="selectedChapter===16" class="panel calc-lab" aria-label="采购CPIF FPIF合同价格计算器">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · CONTRACTS</span><h3>采购合同 CPIF / FPIF 计算器</h3><p>输入目标成本、目标费用、实际成本、卖方分担比例及 FPIF 封顶价。演示数据可自由修改。</p></div><div class="calc-result"><small>CPIF买方支付</small><strong>{{displayNum(procurementCalcResult.cpif)}} <span>万元</span></strong></div></div>
          <div class="evm-input-grid"><label v-for="field in [{key:'targetCost',label:'目标成本',unit:'万元',max:100000},{key:'targetFee',label:'目标费用',unit:'万元',max:100000},{key:'actualCost',label:'实际成本',unit:'万元',max:100000},{key:'sellerShare',label:'卖方分担比例',unit:'%',max:100},{key:'ceiling',label:'FPIF最高限价',unit:'万元',max:100000}]" :key="field.key"><span>{{field.label}}</span><div><input type="number" min="0" :max="field.max" step="1" v-model.number="procCalc[field.key]" :aria-label="field.label"/><small>{{field.unit}}</small></div></label></div>
          <div class="calc-tiles"><div><small>激励费用</small><strong>{{displayNum(procurementCalcResult.fee)}}</strong><span>目标费用+(目标−实际成本)×卖方比例</span></div><div><small>CPIF 买方付款</small><strong>{{displayNum(procurementCalcResult.cpif)}}</strong><span>实际成本 + 激励费用</span></div><div><small>FPIF 买方付款</small><strong>{{displayNum(procurementCalcResult.fpif)}}</strong><span>不超过合同最高限价</span></div><div><small>FPIF 卖方实际利润</small><strong :class="procurementCalcResult.sellerProfitFpif<0?'calc-negative':''">{{displayNum(procurementCalcResult.sellerProfitFpif)}}</strong><span>最终付款 − 实际成本</span></div></div>
          <p class="calc-hint">按原讲义第17–19页的激励分成模型简化计算，适用于示例所述情形；实际合同仍以约定的激励条款、比例及封顶机制为准。</p>
        </section>


        <!-- 第17章：权力利益矩阵 -->
        <section v-if="selectedChapter===17" class="panel calc-lab" aria-label="干系人权力利益分析实验室">
          <div class="calc-heading"><div><span class="calc-kicker">INTERACTIVE · STAKEHOLDER</span><h3>干系人权力—利益矩阵</h3><p>拖动两个数值，模拟干系人分类及管理策略。为便于学习，示例把6分设为高低分界。</p></div><div class="calc-result"><small>当前管理策略</small><strong style="font-size:26px">{{stakeholderStrategy.name}}</strong></div></div>
          <div class="strategy-lab"><div class="strategy-grid"><div class="quadrant" :class="{active:stakeholderPower>=6 && stakeholderInterest<6}"><b>高权力 · 低利益</b><strong>令其满意</strong></div><div class="quadrant" :class="{active:stakeholderPower>=6 && stakeholderInterest>=6}"><b>高权力 · 高利益</b><strong>重点管理</strong></div><div class="quadrant" :class="{active:stakeholderPower<6 && stakeholderInterest<6}"><b>低权力 · 低利益</b><strong>适度监督</strong></div><div class="quadrant" :class="{active:stakeholderPower<6 && stakeholderInterest>=6}"><b>低权力 · 高利益</b><strong>随时告知</strong></div></div><div class="strategy-controls"><label>权力 / 影响能力 <strong>{{stakeholderPower}} / 10</strong><input type="range" min="1" max="10" v-model.number="stakeholderPower"></label><label>利益 / 关注程度 <strong>{{stakeholderInterest}} / 10</strong><input type="range" min="1" max="10" v-model.number="stakeholderInterest"></label><p>{{stakeholderStrategy.detail}}</p></div></div>
          <p class="calc-hint">原讲义第14–16页的权力、利益分类及参与策略。这里的分数和阈值仅是交互演示，不是讲义规定的量化标准。</p>
        </section>
        <!-- 第18章：八大绩效域比较 -->

      <div class="writing-layout"><section class="panel writing-panel"><div class="writing-heading"><h3>论文草稿</h3><span>{{state.essayDraft.body.length}} 字</span></div><label class="textarea-label">论文题目</label><input class="form-input" v-model="state.essayDraft.title" placeholder="如：论信息系统项目的风险管理"/><label class="textarea-label">正文</label><textarea class="learning-textarea essay-editor" v-model="state.essayDraft.body" placeholder="摘要：……\n\n项目背景：……\n\n管理过程：……\n\n经验总结：……"></textarea><div class="writing-tools"><span class="save-hint">✓ 自动保存</span><button class="outline-btn" @click="downloadText('论文草稿',state.essayDraft.title+'\n\n'+state.essayDraft.body)">导出 TXT</button></div></section><aside class="panel writing-guide"><h3>写作结构建议</h3><div v-for="(t,i) in ['摘要：简述项目及本人职责、管理目标','项目背景：规模、周期、技术、干系人','正文：按题目要求展开管理过程与实际举措','收尾：结果、问题反思与经验总结']" class="guide-step"><span>{{i+1}}</span><p>{{t}}</p></div><div class="writing-helper"><strong>可复用模块</strong><p>后续每个知识领域可单独关联一套论文写作素材、真实项目案例和范文练习。</p></div></aside></div></template>
      <!-- 学习统计 -->
      <template v-else-if="activeView==='progress'"><div class="page-heading compact"><div><div class="eyebrow">STUDY INSIGHTS</div><h1>学习统计</h1><p>学习痕迹在浏览器本地积累，帮助你安排下一轮复习。</p></div></div><div class="stat-grid progress-stat"><div class="stat-card" v-for="s in dashboardStats" :key="s.label"><div class="stat-head"><span class="stat-ico" :class="s.tone" v-html="icon(s.icon)"></span></div><div class="stat-value">{{s.value}}</div><div class="stat-name">{{s.label}}</div></div></div><div class="panel progress-visual-panel"><div class="panel-heading"><div><h3>学习表现对比</h3><p>以实际作答为依据，没有作答的章节不显示虚构正确率。</p></div></div><div class="progress-charts"><div v-for="s in visualChapterStats" :key="s.id" class="progress-chart-item"><div class="progress-chart-title"><strong>第 {{String(s.id).padStart(2,'0')}} 章 · {{s.name}}</strong><button @click="openChapter(s.id)">进入章节 ↗</button></div><div class="progress-chart-line"><span>掌握率</span><div><i class="bar-master" :style="{width:s.mastery+'%'}"></i></div><strong>{{s.mastery}}%</strong></div><div class="progress-chart-line"><span>答题正确率</span><div><i class="bar-accuracy" :style="{width:(s.answered?s.accuracy:0)+'%'}"></i></div><strong>{{s.answered?s.accuracy+'%':'暂无'}}</strong></div><small>{{s.mastered}}/{{s.topics}} 小节已掌握 · {{s.answered}} 道题已练习</small></div></div></div><div class="home-columns"><section class="panel"><div class="panel-heading"><div><h3>章节掌握情况</h3><p>按当前已录入的 {{allTopics.length}} 个知识小节统计</p></div><span class="strong-progress">{{masteryPercent}}%</span></div><div class="section-progress" v-for="s in allChapterData.flatMap(d=>d.sections||[])"><div><strong>{{s.id}} {{s.title}}</strong><span>{{s.children.filter(c=>state.mastered.includes(c.id)).length}}/{{s.children.length}}</span></div><div class="progress-track"><span :style="{width:s.children.filter(c=>state.mastered.includes(c.id)).length/s.children.length*100+'%'}"></span></div></div></section><section class="panel"><div class="panel-heading"><div><h3>答题反馈</h3><p>根据当前保留的最后一次练习作答统计</p></div></div><div class="accuracy-circle" :style="{'--pct':answerAccuracy+'%'}"><div><strong>{{answerAccuracy}}%</strong><span>练习正确率</span></div></div><div class="accuracy-legend"><span>已作答 {{answeredCount}} 道</span><span>错题本 {{state.wrongIds.length}} 道</span><span>模拟考试 {{state.exams.length}} 次</span></div></section></div><div class="panel history-panel"><div class="panel-heading"><div><h3>最近模拟考试</h3><p>按时间倒序保留历史记录</p></div></div><div v-if="!state.exams.length" class="empty-inline">暂无模拟考试记录。完成一次模拟考试后，这里将展示成绩。</div><div class="history-row" v-for="e in [...state.exams].reverse().slice(0,15)" :key="e.id"><span class="history-date">{{new Date(e.finishedAt).toLocaleString('zh-CN')}}</span><strong>{{e.score}} 分</strong><span>答对 {{e.correct}} / {{e.total}} 题</span></div></div></template>
      <!-- 搜索 -->
      <template v-else-if="activeView==='search'"><div class="page-heading compact"><div><div class="eyebrow">SEARCH YOUR KNOWLEDGE</div><h1>全站搜索</h1><p>搜索已录入的章节名称、知识小节、重点清单与练习题。</p></div></div><div class="search-big panel"><span v-html="icon('search')"></span><input v-model="searchQuery" placeholder="输入关键词，如：数字经济、车联网、数据资产化……"/></div><div class="search-count" v-if="searchQuery.trim()">找到 {{searchResults.length}} 条结果</div><div v-for="r in searchResults" :key="r.type+r.id" class="search-result panel" @click="openSearchResult(r)"><span class="search-result-type">{{r.type==='chapter'?'章节':r.type==='topic'?'小节':r.type==='question'?'练习':'考点'}}</span><div><strong>{{r.title}}</strong><p>{{r.desc}}</p></div><span>→</span></div><div v-if="!searchResults.length" class="empty-panel"><h3>{{searchQuery?'没有找到匹配内容':'输入一个关键词开始搜索'}}</h3></div></template>
      <!-- 设置和导入 -->
      <template v-else-if="activeView==='settings'"><div class="page-heading compact"><div><div class="eyebrow">DATA & PREFERENCES</div><h1>数据与设置</h1><p>无需服务端，所有学习记录只保存在当前设备当前浏览器。</p></div></div><div class="settings-grid"><section class="panel settings-panel"><h3>资料导入</h3><p>24 章内容已内置。如需个性化，可导入任一章节的结构化 JSON；不会覆盖既有答题与学习记录。</p><div class="import-box"><span v-html="icon('upload')"></span><strong>导入章节 JSON</strong><small>支持章节标题、目录、考点、习题和解析</small><label class="primary-btn file-label">选择 JSON 文件<input type="file" accept=".json,application/json" @change="importDataFile" hidden/></label></div><button class="inline-link" @click="downloadTemplate">下载章节导入模板 JSON ↓</button><p v-if="importMessage" class="import-feedback" :class="{'error':importError}">{{importMessage}}</p></section><section class="panel settings-panel"><h3>个人学习数据</h3><p>导出本地学习记录可用于迁移设备或备份。导入记录会覆盖本地已有记录，请先备份。</p><div class="settings-actions"><button class="outline-btn" @click="exportProgress"><span v-html="icon('download')"></span> 导出学习记录</button><label class="outline-btn file-label"><span v-html="icon('upload')"></span> 导入学习记录<input type="file" accept=".json" hidden @change="importProgress" /></label><button class="danger-outline-btn" @click="clearProgress">清空学习记录</button></div></section><section class="panel settings-panel"><h3>外观偏好</h3><div class="setting-switch"><div><strong>深色模式</strong><small>切换舒适的阅读配色</small></div><button class="switch" :class="{'checked':state.settings.dark}" @click="state.settings.dark=!state.settings.dark"><span></span></button></div></section><section class="panel settings-panel"><h3>版本与数据说明</h3><div class="about-list"><div><span>网站版本</span><strong>v2.0 · 全24章图解计算版 · 纯前端</strong></div><div><span>教材章节</span><strong>第 4 版 · 24 章</strong></div><div><span>已录入资料</span><strong>第 1–24 章 · 444 个知识小节 + 800 道题</strong></div><div><span>数据储存</span><strong>localStorage（本机）</strong></div><div><span>外部依赖</span><strong>Vue 3 已随项目打包</strong></div></div></section></div><div class="panel architecture-panel"><h3>章节内容扩展结构</h3><p>每章以 chapterId 为主键，各模块用统一编号关联，让同一知识点连接学习、真题、错题、案例与论文。</p><div class="architecture-flow"><div>章节<br/><strong>Chapter</strong></div><span>→</span><div>知识小节<br/><strong>Topics</strong></div><span>→</span><div>考点卡片<br/><strong>Notes</strong></div><span>→</span><div>题库 / 案例 / 论文<br/><strong>Practice</strong></div><span>→</span><div>复习记录<br/><strong>Progress</strong></div></div></div></template>
    </main>
    <footer class="app-footer"><span>高项研习社 · 专注信息系统项目管理师学习</span><span>第 1–24 章依据上传的讲义及导图独立整理 · 426 张交互式图解 · 年份沿用资料标记，未宣称全部为官方真题</span></footer>
  </div>
  <div v-if="toast" class="toast" role="status">{{toast}}</div>
</div>
